<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#030303;color:#ffffff;font-family:Inter,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#030303;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#050505;border:1px solid #1b1b1b;">
            <tr>
              <td style="padding:40px 32px 16px 32px;">
                <div style="font-size:12px;font-weight:800;letter-spacing:0.35em;text-transform:uppercase;color:#ccff00;">FeedMe</div>
                <h1 style="margin:18px 0 12px 0;font-size:34px;line-height:1;letter-spacing:-0.06em;text-transform:uppercase;font-weight:900;color:#ffffff;">
                  Confirm your new email
                </h1>
                <p style="margin:0;font-size:14px;line-height:1.8;color:#b9b9b9;">
                  A new email was added to your FeedMe account. Confirm it to keep your access clean and current.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 36px 32px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ccff00;color:#030303;text-decoration:none;padding:16px 22px;font-size:12px;font-weight:900;letter-spacing:0.22em;text-transform:uppercase;">
                  Confirm email
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
