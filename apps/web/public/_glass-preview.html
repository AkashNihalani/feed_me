<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Me — Glass Depth + Color Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
    min-height: 200vh;
  }

  /* ═══ Mode toggle ═══ */
  .mode-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    display: flex; gap: 6px;
  }
  .mode-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 10px; border: none; cursor: pointer;
    transition: all 0.3s ease;
  }

  /* Color toggle */
  .color-toggle {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    display: flex; gap: 5px; flex-wrap: wrap; max-width: 220px;
  }
  .color-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent;
    cursor: pointer; transition: all 0.2s ease;
  }
  .color-btn.active { border-color: #fff; transform: scale(1.15); }

  /* ═══ BACKGROUND MESH ═══ */
  /* This is the KEY to making glass work on dashboard —
     subtle color mesh gives the blur something to refract */
  .app-bg {
    position: fixed; inset: 0; z-index: 0;
    transition: background 0.5s ease;
  }

  /* Light mode background */
  .app-bg.light {
    background: #f5f5f7;
  }
  .app-bg.light::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, var(--mesh-1, rgba(124,58,237,0.07)) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 30%, var(--mesh-2, rgba(124,58,237,0.05)) 0%, transparent 50%),
      radial-gradient(ellipse 70% 40% at 50% 80%, var(--mesh-3, rgba(124,58,237,0.04)) 0%, transparent 50%);
    animation: meshDrift 12s ease-in-out infinite alternate;
  }

  /* Dark mode background */
  .app-bg.dark {
    background: #000000;
  }
  .app-bg.dark::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 5%, var(--mesh-1, rgba(124,58,237,0.12)) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 85% 25%, var(--mesh-2, rgba(124,58,237,0.08)) 0%, transparent 45%),
      radial-gradient(ellipse 60% 40% at 40% 75%, var(--mesh-3, rgba(124,58,237,0.06)) 0%, transparent 50%);
    animation: meshDrift 12s ease-in-out infinite alternate;
  }

  @keyframes meshDrift {
    0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
    100% { transform: translate3d(10px, -8px, 0) scale(1.03); opacity: 0.85; }
  }

  /* ═══ CONTENT ═══ */
  .content { position: relative; z-index: 1; padding: 80px 20px 40px; max-width: 800px; margin: 0 auto; }

  .section-label {
    font-size: 10px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase;
    text-align: center; margin-bottom: 20px; opacity: 0.5;
  }

  /* ═══ GLASS CARD (matches your fm-depth-glass) ═══ */
  .glass-card {
    position: relative;
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 14px;
    transition: all 0.4s ease;
  }

  /* Light glass */
  .light .glass-card {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.72)),
      rgba(255,255,255,0.7);
    border: 1px solid rgba(12, 18, 28, 0.06);
    border-top-color: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(44px) saturate(190%);
    -webkit-backdrop-filter: blur(44px) saturate(190%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.96) inset,
      0 -1px 0 rgba(9,14,22,0.04) inset,
      0 1px 2px rgba(15,23,42,0.03),
      0 8px 18px rgba(15,23,42,0.05),
      0 22px 46px -14px rgba(15,23,42,0.08);
    color: #000;
  }
  .light .glass-card::before {
    content: "";
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.12) 26%, transparent 56%);
    opacity: 0.35;
  }

  /* Dark glass */
  .dark .glass-card {
    background: rgba(8, 8, 8, 0.6);
    border: 1px solid rgba(255,255,255,0.06);
    border-top-color: rgba(255,255,255,0.10);
    backdrop-filter: blur(48px) saturate(120%);
    -webkit-backdrop-filter: blur(48px) saturate(120%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 -1px 0 rgba(0,0,0,0.6) inset,
      0 2px 4px rgba(0,0,0,0.3),
      0 8px 16px rgba(0,0,0,0.4),
      0 24px 48px -8px rgba(0,0,0,0.5);
    color: #fff;
  }
  .dark .glass-card::before {
    content: "";
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 25%);
  }

  /* ═══ INNER WELL (matches fm-depth-inner) ═══ */
  .inner-well {
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .light .inner-well {
    background: rgba(16,24,40,0.035);
    border: 1px solid rgba(15,23,42,0.04);
    box-shadow: 0 2px 6px rgba(15,23,42,0.04) inset, 0 -1px 0 rgba(255,255,255,0.5) inset;
  }
  .dark .inner-well {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5) inset, 0 -1px 0 rgba(255,255,255,0.03) inset;
  }

  /* ═══ CHIP (matches fm-depth-chip) ═══ */
  .glass-chip {
    display: inline-flex; align-items: center;
    border-radius: 10px; padding: 5px 12px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .light .glass-chip {
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(14,19,28,0.06);
    border-top-color: rgba(255,255,255,0.84);
    box-shadow: 0 1px 0 rgba(255,255,255,0.82) inset, 0 4px 12px -4px rgba(15,23,42,0.1);
  }
  .dark .glass-chip {
    background: rgba(16,16,16,0.65);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 3px 8px rgba(0,0,0,0.35);
  }

  /* ═══ ACCENT CHIP ═══ */
  .accent-chip {
    display: inline-flex; align-items: center;
    border-radius: 10px; padding: 5px 12px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-text);
    box-shadow: 0 2px 8px var(--accent-shadow);
  }

  /* ═══ UI Elements ═══ */
  .pill-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .mock-title { font-size: 9px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.45; margin-bottom: 8px; }
  .hero-num { font-size: 38px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; margin-bottom: 4px; }
  .hero-sub { font-size: 10px; font-weight: 700; opacity: 0.35; margin-bottom: 12px; }

  /* Chart */
  .chart-well { position: relative; overflow: hidden; }
  .chart-well svg { display: block; }

  /* Bars */
  .bars-row { display: flex; gap: 5px; align-items: flex-end; height: 72px; }
  .bar-track { flex: 1; border-radius: 4px; position: relative; overflow: hidden; }
  .light .bar-track { background: rgba(0,0,0,0.04); }
  .dark .bar-track { background: rgba(255,255,255,0.05); }
  .bar-fill { position: absolute; bottom: 0; left: 0; right: 0; border-radius: 4px; background: var(--accent); }
  .bar-fill.muted { background: currentColor; opacity: 0.08; }

  /* Scatter */
  .scatter-well { position: relative; height: 60px; }
  .dot { position: absolute; border-radius: 50%; }
  .dot.accent { background: var(--accent); }
  .light .dot.muted { background: rgba(0,0,0,0.12); }
  .dark .dot.muted { background: rgba(255,255,255,0.12); }

  /* Heatmap */
  .heatmap-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
  .hm { aspect-ratio: 1; border-radius: 3px; }
  .light .hm.empty { background: rgba(0,0,0,0.035); }
  .dark .hm.empty { background: rgba(255,255,255,0.04); }

  /* Button */
  .accent-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
    box-shadow: 0 4px 14px var(--accent-shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .accent-btn:hover { transform: translateY(-1px); }
  .accent-btn:active { transform: translateY(1px); box-shadow: 0 2px 6px var(--accent-shadow); }

  /* Bento grid */
  .bento { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .bento { grid-template-columns: 1fr 1fr; } }

  /* Stat row */
  .stat-row { display: flex; gap: 10px; }
  .stat-box { flex: 1; }
  .stat-label { font-size: 8px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.4; margin-bottom: 3px; }
  .stat-val { font-size: 20px; font-weight: 900; letter-spacing: -0.03em; }
</style>
</head>
<body>

<!-- Mode toggle -->
<div class="mode-toggle">
  <button class="mode-btn" onclick="setMode('light')" id="btn-light" style="background:#f5f5f7;color:#000;">Light</button>
  <button class="mode-btn" onclick="setMode('dark')" id="btn-dark" style="background:#111;color:#fff;">Dark</button>
</div>

<!-- Color swatches -->
<div class="color-toggle">
  <button class="color-btn" style="background:#7C3AED;" onclick="setColor('violet')" title="Violet"></button>
  <button class="color-btn" style="background:#E11D48;" onclick="setColor('rose')" title="Brand Rose"></button>
  <button class="color-btn" style="background:#FF6B00;" onclick="setColor('orange')" title="Orange"></button>
  <button class="color-btn" style="background:#2563EB;" onclick="setColor('blue')" title="Blue"></button>
  <button class="color-btn" style="background:#E11D48;" onclick="setColor('green')" title="Brand Rose"></button>
</div>

<!-- Background mesh layer -->
<div class="app-bg dark" id="app-bg"></div>

<!-- Dashboard content -->
<div class="content" id="content-wrap">

  <div class="section-label" id="color-name">Electric Violet · Glass Depth System</div>

  <!-- Hero card -->
  <div class="glass-card">
    <div class="mock-title">Follower Ascent</div>
    <div class="pill-row">
      <div class="accent-chip" id="pill-active">7D</div>
      <div class="glass-chip">30D</div>
      <div class="glass-chip">60D</div>
      <div class="glass-chip">90D</div>
    </div>
    <div class="hero-num">12,847</div>
    <div class="hero-sub">Total Followers</div>
    <div class="accent-chip" id="delta-chip" style="margin-bottom:16px;">↑ 14.2%</div>

    <!-- Chart inside inner well -->
    <div class="inner-well chart-well">
      <svg width="100%" height="56" viewBox="0 0 500 56" preserveAspectRatio="none" id="chart-svg">
        <defs>
          <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" id="grad-top" stop-color="#7C3AED" stop-opacity="0.18"/>
            <stop offset="100%" id="grad-bot" stop-color="#7C3AED" stop-opacity="0.01"/>
          </linearGradient>
        </defs>
        <path d="M0 48 Q60 42 130 34 T260 22 T380 26 T500 12 V56 H0Z" fill="url(#chart-grad)"/>
        <path d="M0 48 Q60 42 130 34 T260 22 T380 26 T500 12" fill="none" id="chart-line" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Stats row -->
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Avg. Views</div>
        <div class="stat-val">24.3K</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Engagement</div>
        <div class="stat-val">3.8%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Percentile</div>
        <div class="stat-val" id="pct-val" style="color:var(--accent);">P87</div>
      </div>
    </div>
  </div>

  <!-- Bento row: Bars + Scatter -->
  <div class="bento">
    <!-- Performance bars -->
    <div class="glass-card">
      <div class="mock-title">Performance Pulse</div>
      <div class="inner-well">
        <div class="bars-row" id="bars-container">
          <div class="bar-track" style="height:72px"><div class="bar-fill" style="height:78%;"></div></div>
          <div class="bar-track" style="height:72px"><div class="bar-fill" style="height:55%;opacity:0.7;"></div></div>
          <div class="bar-track" style="height:72px"><div class="bar-fill muted" style="height:35%;"></div></div>
          <div class="bar-track" style="height:72px"><div class="bar-fill" style="height:92%;"></div></div>
          <div class="bar-track" style="height:72px"><div class="bar-fill muted" style="height:28%;"></div></div>
          <div class="bar-track" style="height:72px"><div class="bar-fill" style="height:65%;opacity:0.8;"></div></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="accent-chip">2.4x Views</div>
        <div class="glass-chip">1.1x Likes</div>
      </div>
    </div>

    <!-- Scatter -->
    <div class="glass-card">
      <div class="mock-title">Scatter Field</div>
      <div class="inner-well scatter-well" id="scatter-container">
        <div class="dot accent" style="left:8%;top:16%;width:9px;height:9px;"></div>
        <div class="dot muted" style="left:18%;top:58%;width:6px;height:6px;"></div>
        <div class="dot accent" style="left:30%;top:10%;width:8px;height:8px;"></div>
        <div class="dot muted" style="left:42%;top:68%;width:6px;height:6px;"></div>
        <div class="dot muted" style="left:55%;top:42%;width:6px;height:6px;"></div>
        <div class="dot accent" style="left:65%;top:8%;width:9px;height:9px;"></div>
        <div class="dot muted" style="left:75%;top:52%;width:6px;height:6px;"></div>
        <div class="dot accent" style="left:88%;top:20%;width:8px;height:8px;"></div>
      </div>
      <div class="pill-row">
        <div class="accent-chip">Views</div>
        <div class="glass-chip">Likes</div>
        <div class="glass-chip">Comments</div>
      </div>
    </div>
  </div>

  <!-- Heatmap -->
  <div class="glass-card">
    <div class="mock-title">Posting Heatmap · 13 Weeks</div>
    <div class="inner-well">
      <div class="heatmap-grid" id="heatmap-grid"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;">
      <div class="glass-chip">52 posts</div>
      <button class="accent-btn">Export CSV ↓</button>
    </div>
  </div>

  <div style="height:200px;"></div>
</div>

<script>
  // Color definitions
  const colors = {
    violet: {
      name: 'Electric Violet',
      accent: '#7C3AED',
      accentLight: '#A78BFA',
      accentText: '#ffffff',
      shadow: 'rgba(124,58,237,0.3)',
      mesh1L: 'rgba(124,58,237,0.07)', mesh2L: 'rgba(124,58,237,0.05)', mesh3L: 'rgba(124,58,237,0.04)',
      mesh1D: 'rgba(124,58,237,0.14)', mesh2D: 'rgba(124,58,237,0.09)', mesh3D: 'rgba(124,58,237,0.06)',
      heatOpacities: [0.1, 0.22, 0.42, 0.7, 0.92],
    },
    rose: {
      name: 'Electric Rose',
      accent: '#E11D48',
      accentLight: '#FB7185',
      accentText: '#ffffff',
      shadow: 'rgba(225,29,72,0.3)',
      mesh1L: 'rgba(225,29,72,0.06)', mesh2L: 'rgba(225,29,72,0.04)', mesh3L: 'rgba(225,29,72,0.03)',
      mesh1D: 'rgba(225,29,72,0.12)', mesh2D: 'rgba(225,29,72,0.07)', mesh3D: 'rgba(225,29,72,0.05)',
      heatOpacities: [0.1, 0.22, 0.42, 0.7, 0.92],
    },
    orange: {
      name: 'Blaze Orange',
      accent: '#FF6B00',
      accentLight: '#FF8C3A',
      accentText: '#ffffff',
      shadow: 'rgba(255,107,0,0.3)',
      mesh1L: 'rgba(255,107,0,0.06)', mesh2L: 'rgba(255,107,0,0.04)', mesh3L: 'rgba(255,107,0,0.03)',
      mesh1D: 'rgba(255,107,0,0.12)', mesh2D: 'rgba(255,107,0,0.07)', mesh3D: 'rgba(255,107,0,0.05)',
      heatOpacities: [0.1, 0.22, 0.42, 0.7, 0.92],
    },
    blue: {
      name: 'Electric Blue',
      accent: '#2563EB',
      accentLight: '#60A5FA',
      accentText: '#ffffff',
      shadow: 'rgba(37,99,235,0.3)',
      mesh1L: 'rgba(37,99,235,0.06)', mesh2L: 'rgba(37,99,235,0.04)', mesh3L: 'rgba(37,99,235,0.03)',
      mesh1D: 'rgba(37,99,235,0.12)', mesh2D: 'rgba(37,99,235,0.07)', mesh3D: 'rgba(37,99,235,0.05)',
      heatOpacities: [0.1, 0.22, 0.42, 0.7, 0.92],
    },
    green: {
      name: 'Brand Rose',
      accent: '#E11D48',
      accentLight: '#E11D48',
      accentText: '#ffffff',
      shadow: 'rgba(225,29,72,0.3)',
      mesh1L: 'rgba(225,29,72,0.06)', mesh2L: 'rgba(225,29,72,0.04)', mesh3L: 'rgba(225,29,72,0.03)',
      mesh1D: 'rgba(225,29,72,0.14)', mesh2D: 'rgba(225,29,72,0.08)', mesh3D: 'rgba(225,29,72,0.05)',
      heatOpacities: [0.1, 0.22, 0.42, 0.7, 0.92],
    },
  };

  let currentMode = 'dark';
  let currentColor = 'rose';

  function setMode(mode) {
    currentMode = mode;
    render();
  }

  function setColor(color) {
    currentColor = color;
    render();
  }

  function render() {
    const c = colors[currentColor];
    const isDark = currentMode === 'dark';
    const bg = document.getElementById('app-bg');
    const wrap = document.getElementById('content-wrap');

    // Background
    bg.className = 'app-bg ' + currentMode;
    const m1 = isDark ? c.mesh1D : c.mesh1L;
    const m2 = isDark ? c.mesh2D : c.mesh2L;
    const m3 = isDark ? c.mesh3D : c.mesh3L;
    bg.style.setProperty('--mesh-1', m1);
    bg.style.setProperty('--mesh-2', m2);
    bg.style.setProperty('--mesh-3', m3);

    // Content mode class
    wrap.className = 'content ' + currentMode;

    // CSS vars
    document.documentElement.style.setProperty('--accent', c.accent);
    document.documentElement.style.setProperty('--accent-text', c.accentText);
    document.documentElement.style.setProperty('--accent-shadow', c.shadow);

    // Label
    document.getElementById('color-name').textContent = c.name + ' · Glass Depth System';
    document.getElementById('color-name').style.color = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';

    // Chart
    const lineColor = isDark ? c.accentLight : c.accent;
    document.getElementById('chart-line').setAttribute('stroke', lineColor);
    document.getElementById('grad-top').setAttribute('stop-color', lineColor);
    document.getElementById('grad-bot').setAttribute('stop-color', lineColor);

    // Pct value color
    document.getElementById('pct-val').style.color = c.accent;

    // Heatmap
    const grid = document.getElementById('heatmap-grid');
    grid.innerHTML = '';
    const heatColor = isDark ? c.accentLight : c.accent;
    // 4 rows x 13 cols
    const pattern = [
      [0,1,0,2,0,3,0,1,0,4,0,2,0],
      [1,0,3,0,2,0,1,0,4,0,1,0,2],
      [0,2,0,4,0,1,0,3,0,2,0,1,0],
      [1,0,2,0,1,0,3,0,1,0,4,0,2],
      [0,1,0,3,0,2,0,1,0,2,0,3,0],
      [2,0,1,0,4,0,1,0,3,0,1,0,1],
      [0,3,0,2,0,1,0,2,0,4,0,2,0],
    ];
    for (let r = 0; r < 7; r++) {
      for (let col = 0; col < 13; col++) {
        const div = document.createElement('div');
        div.className = 'hm';
        const level = pattern[r][col];
        if (level === 0) {
          div.classList.add('empty');
        } else {
          const opacity = c.heatOpacities[level];
          div.style.background = heatColor.replace(')', `,${opacity})`).replace('rgb', 'rgba');
          // For hex colors, convert
          const r2 = parseInt(heatColor.slice(1,3), 16);
          const g2 = parseInt(heatColor.slice(3,5), 16);
          const b2 = parseInt(heatColor.slice(5,7), 16);
          div.style.background = `rgba(${r2},${g2},${b2},${opacity})`;
        }
        grid.appendChild(div);
      }
    }

    // Accent dots
    document.querySelectorAll('.dot.accent').forEach(d => {
      d.style.background = isDark ? c.accentLight : c.accent;
    });

    // Color toggle active state
    document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
    const colorBtns = document.querySelectorAll('.color-btn');
    const idx = Object.keys(colors).indexOf(currentColor);
    if (colorBtns[idx]) colorBtns[idx].classList.add('active');

    // Mode buttons
    document.getElementById('btn-light').style.opacity = currentMode === 'light' ? '1' : '0.5';
    document.getElementById('btn-dark').style.opacity = currentMode === 'dark' ? '1' : '0.5';
  }

  // Init
  render();
</script>

</body>
</html>
