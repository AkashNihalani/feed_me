services:
  feedme-worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: feedme-worker
    restart: always
    network_mode: host
    env_file:
      - ./apps/worker/.env
    environment:
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
