<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>Feeder Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a sticky bar carries the feeder and the run switcher. Overview = the
   whole wall (one row per run). A run = its ten covers, large. The detail lives
   in a side panel on desktop and a draggable sheet on phones.
   Deliberately single-theme: a dark, lit wall in FeedMe's rose. */
:root {
  color-scheme: dark;
  --bg: #050506;
  --s1: #0c0c0f;
  --s2: #131317;
  --s3: #1b1b21;
  --hair: rgba(255, 255, 255, 0.07);
  --hair-2: rgba(255, 255, 255, 0.12);
  --ink: #fafafa;
  --ink-2: #a3a3ad;
  --ink-3: #62626c;
  --rose: #fb7185;
  --rose-2: #e11d48;
  --rose-glow: rgba(251, 113, 133, 0.42);
  --rose-wash: rgba(251, 113, 133, 0.12);
  --down: #e4e4e7;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --bar-h: 112px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 10px; }
.k { font: 600 10.5px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: clamp(16px, 2.4vw, 32px); }

/* ---------- sticky bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(5, 5, 6, 0.8); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-bottom: 1px solid var(--hair); }
.bar .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-block: 12px 10px; }
.row1 { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { font: 700 18px/1 var(--display); letter-spacing: -0.03em; }
.logo i { font-style: normal; color: var(--rose); }
.who { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--s2); position: relative; min-width: 0; flex: 0 1 auto; }
.who button { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 999px; font: 500 13px/1 var(--body); color: var(--ink-2); transition: color .25s; }
.who button[aria-pressed="true"] { color: var(--bg); }
.who button small { font: 500 9.5px/1 var(--mono); letter-spacing: .08em; opacity: .6; text-transform: uppercase; }
.who .av { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #fb7185, #7c3aed); flex: none; }
.who button:nth-child(3) .av { background: linear-gradient(135deg, #f9a8d4, #be123c); }
.who .ind, .rail .ind { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--ink); transition: transform .45s var(--ease), width .45s var(--ease); z-index: 0; }
.mem { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.mem .track { width: 120px; height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; display: flex; }
.mem .track i { height: 100%; background: var(--ink-3); transition: width .6s var(--ease); }
.mem .track i + i { background: var(--rose); }
.mem span { font: 500 11.5px/1 var(--mono); color: var(--ink-2); white-space: nowrap; }
.mem b { color: var(--ink); }
.row2 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rail { position: relative; flex: 0 1 auto; min-width: 0; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--s2); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.rail::-webkit-scrollbar { display: none; }
.rail button { position: relative; z-index: 1; flex: none; padding: 8px 14px; border-radius: 999px; font: 600 12.5px/1 var(--body); color: var(--ink-2); white-space: nowrap; transition: color .25s; display: inline-flex; gap: 6px; align-items: center; }
.rail button em { font: 600 10px/1 var(--mono); font-style: normal; color: var(--ink-3); transition: color .25s; }
.rail button[aria-current="true"] { color: var(--bg); }
.rail button[aria-current="true"] em { color: rgba(5,5,6,.55); }
.rail button .live { width: 6px; height: 6px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 3px var(--rose-wash); }
.iconbtn { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); color: var(--ink-2); transition: background .2s, color .2s, transform .2s var(--spring); }
.iconbtn:hover { color: var(--ink); background: var(--s3); }
.iconbtn:active { transform: scale(.92); }
.iconbtn svg { width: 15px; height: 15px; }
.iconbtn.on { background: var(--rose); color: #000; }

/* ---------- layout ---------- */
.page { padding-block: 22px 140px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
@media (min-width: 1000px) { .page { grid-template-columns: minmax(0, 1fr) 392px; gap: 32px; } }
#main { min-width: 0; view-transition-name: main; }

/* hero */
.hero { display: grid; gap: 14px; margin-bottom: 26px; }
.hero h1 { font: 700 clamp(38px, 5.6vw, 76px)/0.94 var(--display); letter-spacing: -0.045em; margin: 0; max-width: 17ch; text-wrap: balance; }
.hero p { margin: 0; color: var(--ink-2); font-size: clamp(15px, 1.25vw, 17px); max-width: 58ch; line-height: 1.55; }
.hero .k b { color: var(--rose); font-weight: 600; }

/* viewpoints */
.vps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(208px, 1fr); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 0 30px; padding: 2px; }
.vps::-webkit-scrollbar { display: none; }
@media (max-width: 760px) { .vps { grid-auto-columns: 74%; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; } }
.vp { scroll-snap-align: start; display: grid; gap: 14px; align-content: space-between; padding: 14px 14px 13px; border-radius: 16px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); min-height: 118px; transition: box-shadow .3s, background .3s, transform .25s var(--spring), opacity .3s; }
.vp:hover { background: var(--s2); }
.vp:active { transform: scale(.98); }
.vp b { font: 600 15px/1.2 var(--display); letter-spacing: -0.015em; }
.vp .m { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.vp .m strong { font: 700 22px/1 var(--display); letter-spacing: -0.03em; }
.vp .m strong small { font: 500 10px/1 var(--mono); color: var(--ink-3); letter-spacing: 0.08em; margin-left: 2px; }
.vp .gauge { height: 4px; border-radius: 2px; background: var(--s3); position: relative; }
.vp .gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--rose); }
.vp .gauge u { position: absolute; top: -3px; width: 2px; height: 10px; border-radius: 1px; background: var(--ink-2); }
.vp .st { display: flex; align-items: center; gap: 6px; font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.dot.settled { background: var(--ink); }
.dot.tested { background: var(--ink-3); }
.dot.emerging { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.vp[aria-pressed="true"] { background: linear-gradient(160deg, rgba(251,113,133,.16), var(--s1) 70%); box-shadow: inset 0 0 0 1.5px var(--rose); }
.vps.has-on .vp:not([aria-pressed="true"]) { opacity: .5; }

/* overview wall */
.runs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.runrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.hero, .runtop, .pv { grid-template-columns: minmax(0, 1fr); }
.runhd { display: flex; align-items: center; gap: 12px; padding: 2px 0; width: 100%; }
.runhd .n { font: 600 10.5px/1 var(--mono); letter-spacing: .12em; color: var(--ink-3); flex: none; }
.runhd .t { font: 600 16px/1.2 var(--display); letter-spacing: -0.015em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .2s; }
.runhd .h { margin-left: auto; display: inline-flex; gap: 3px; flex: none; }
.runhd .h i { width: 4px; height: 12px; border-radius: 1px; background: var(--s3); }
.runhd .h i.on { background: var(--rose); }
.runhd .go { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); color: var(--ink-2); transition: transform .3s var(--spring), background .2s, color .2s; }
.runhd .go svg { width: 13px; height: 13px; }
.runhd:hover .go { transform: translateX(3px); background: var(--ink); color: var(--bg); }
.runhd:hover .t { color: var(--rose); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; } }

/* run page */
.runtop { display: grid; gap: 14px; margin-bottom: 22px; }
.runtop h1 { font: 700 clamp(34px, 4.6vw, 60px)/0.96 var(--display); letter-spacing: -0.04em; margin: 0; text-wrap: balance; }
.runtop .note { margin: 0; color: var(--ink-2); max-width: 62ch; font-size: 15.5px; line-height: 1.6; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { padding: 12px 14px; border-radius: 14px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); min-width: 104px; display: grid; gap: 7px; }
.stat strong { font: 700 26px/1 var(--display); letter-spacing: -0.03em; }
.stat strong.r { color: var(--rose); }
.stat strong small { font-size: .55em; color: var(--ink-3); }
.bigrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
@media (min-width: 640px) { .bigrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 14px; } }
.card { display: grid; gap: 9px; align-content: start; }
.card .ti { font: 600 13.5px/1.25 var(--display); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .tg { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 600 10px/1 var(--mono); letter-spacing: .06em; padding: 4px 6px; border-radius: 5px; text-transform: uppercase; white-space: nowrap; }
.tag.up { color: var(--rose); background: var(--rose-wash); }
.tag.down { color: var(--down); background: rgba(255,255,255,.08); }
.tag.flat { color: var(--ink-2); background: var(--s2); }
.tag svg { width: 8px; height: 8px; }
.pct { font: 700 13px/1 var(--display); letter-spacing: -0.01em; }
.pct.hi { color: var(--rose); }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; }
.pager button { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); font: 600 13px/1.2 var(--display); transition: background .2s, transform .25s var(--spring); max-width: 49%; min-width: 0; }
.pager button:hover { background: var(--s2); }
.pager button:active { transform: scale(.97); }
.pager button svg { width: 15px; height: 15px; flex: none; }
.pager button span { display: grid; gap: 4px; min-width: 0; }
.pager button span em { font: 600 10px/1 var(--mono); font-style: normal; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.pager button span b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .nx { margin-left: auto; text-align: right; }
.swipehint { display: none; font: 500 11px/1 var(--mono); color: var(--ink-3); text-align: center; margin-top: 16px; }
@media (max-width: 999px) { .swipehint { display: block; } }

/* ---------- cover tile ---------- */
.tile { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; container-type: inline-size; transition: transform .35s var(--spring), opacity .35s var(--ease); }
.bigrid .tile { aspect-ratio: 4 / 5; border-radius: 14px; }
.tile .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: radial-gradient(120% 70% at 50% 72%, rgba(255,255,255,.14), transparent 60%), linear-gradient(168deg, var(--g1), var(--g2)); transition: filter .4s var(--ease); }
.tile .face::before { content: ""; position: absolute; inset: 0; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>"); opacity: .14; mix-blend-mode: overlay; }
.tile .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, transparent 34%, transparent 62%, rgba(0,0,0,.55) 100%); }
.tile .face.gray { filter: grayscale(1) contrast(1.08); }
.tile svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile .cap { position: absolute; z-index: 1; left: 9%; right: 9%; top: 9%; font: 700 clamp(5px, 10cqi, 19px)/1.12 var(--display); color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.7); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.01em; }
.tile .dur { position: absolute; z-index: 1; left: 7%; bottom: 6%; font: 600 clamp(5px, 8.5cqi, 11px)/1 var(--mono); color: rgba(255,255,255,.88); }
.tile .rk { position: absolute; z-index: 1; right: 7%; bottom: 6%; font: 700 clamp(6px, 10cqi, 13px)/1 var(--display); color: #fff; letter-spacing: -0.02em; }
.tile .ring, .tile .fx, .tile .mark { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.tile .fx { overflow: hidden; }
.tile .fx::before { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 20%, rgba(251,113,133,.9) 50%, transparent 80%); opacity: 0; mix-blend-mode: screen; transform: translateX(-100%); }
button.tile:hover { transform: translateY(-3px); }
button.tile:active { transform: scale(.96); }

/* heat: where it landed */
.tile.h4 .ring { animation: breathe 1.8s ease-in-out infinite; animation-delay: var(--dl); }
.tile.h3 .ring { animation: breathe 2.8s ease-in-out infinite; animation-delay: var(--dl); }
.tile.h2 .ring { box-shadow: 0 0 0 1.5px var(--rose); }
.tile.h1 .face { filter: brightness(.8) saturate(.85); }
.tile.h0 .face { filter: brightness(.42) saturate(.2); }
.tile.h1 .face.gray { filter: grayscale(1) brightness(.78); }
.tile.h0 .face.gray { filter: grayscale(1) brightness(.4); }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 1.5px var(--rose), 0 0 0 0 rgba(251,113,133,0); } 50% { box-shadow: 0 0 0 2px var(--rose), 0 0 26px 3px var(--rose-glow); } }

/* lens + focus */
.tile.out { opacity: .14; }
.tile.out .ring { animation: none; box-shadow: none; }
.tile.out .face { filter: grayscale(1) brightness(.55); }
.tile.core:not(.h4):not(.h3) .ring { box-shadow: 0 0 0 1.5px var(--rose); }
.tile.contrast .ring { animation: none; box-shadow: 0 0 0 1.5px var(--down); }
.tile.exc .ring { animation: none; box-shadow: 0 0 0 1.5px var(--ink-3); }
.focus .tile:not(.sel):not(.beat):not(.above):not(.stop) { opacity: .26; }
.focus .tile:not(.sel):not(.beat):not(.above):not(.stop) .ring { animation: none; box-shadow: none; }
.tile.sel { transform: scale(1.07); z-index: 3; }
.tile.sel .ring { animation: none; box-shadow: 0 0 0 2.5px var(--ink), 0 12px 32px rgba(0,0,0,.6); }
.tile.beat .mark { box-shadow: inset 0 -3px 0 var(--rose); background: linear-gradient(0deg, rgba(251,113,133,.3), transparent 55%); }
.tile.beat.go .fx::before { animation: sweep .75s var(--ease) both; animation-delay: var(--wd); }
.tile.beat.go .mark, .tile.above.go .mark { animation: lit .5s var(--ease) both; animation-delay: var(--wd); }
@keyframes sweep { 0% { opacity: 0; transform: translateX(-100%); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateX(100%); } }
@keyframes lit { from { opacity: 0; } to { opacity: 1; } }
.tile.above .mark { box-shadow: inset 0 3px 0 var(--down); background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 50%); }
.tile.stop .ring { animation: none; box-shadow: 0 0 0 2px var(--down); }
.tile.stop .mark::after { content: "STOP"; position: absolute; left: 50%; top: -8px; transform: translateX(-50%); font: 700 8.5px/1 var(--mono); letter-spacing: .12em; background: var(--down); color: #000; padding: 3px 5px; border-radius: 4px; }
.tile.stop.go .mark::after { animation: pop .45s var(--spring) both; animation-delay: var(--wd); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 6px) scale(.6); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
.enter { animation: rise .6s var(--ease) both; animation-delay: var(--ed, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---------- panel / sheet content ---------- */
.panel { position: sticky; top: calc(var(--bar-h) + 16px); max-height: calc(100vh - var(--bar-h) - 32px); overflow: auto; border-radius: 22px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); scrollbar-width: none; }
.panel::-webkit-scrollbar { display: none; }
@media (max-width: 999px) { .panel { display: none; } }
.pv { display: grid; gap: 22px; padding: 20px; }
.pv.enter { animation-duration: .45s; }
.pv.flush { padding: 0; }
.crumbs { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crumbs button { font: 600 12px/1 var(--body); color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; padding: 7px 11px 7px 7px; border-radius: 999px; background: var(--s2); transition: background .2s, color .2s; flex: none; }
.crumbs button:hover { background: var(--s3); color: var(--ink); }
.crumbs button svg { width: 14px; height: 14px; }
.crumbs span { font: 500 12px/1 var(--body); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; align-items: end; }
.phead .tile { aspect-ratio: 9 / 16; border-radius: 14px; }
.phead h2 { font: 700 28px/1 var(--display); letter-spacing: -0.035em; margin: 6px 0 10px; text-wrap: balance; }
.meta { font: 500 11px/1.5 var(--mono); color: var(--ink-3); }
.nums, .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.num { padding: 14px; border-radius: 16px; background: var(--s2); display: grid; gap: 8px; align-content: start; }
.num strong { font: 700 40px/0.9 var(--display); letter-spacing: -0.05em; }
.num strong.r { color: var(--rose); }
.num strong small { font-size: 0.5em; letter-spacing: -0.02em; margin-left: 1px; }
.num .k { line-height: 1.4; }

/* resistance chart */
.res { display: grid; gap: 12px; padding: 16px 16px 14px; border-radius: 18px; background: var(--s2); }
.res-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.res > svg { width: 100%; height: auto; display: block; overflow: visible; }
.res .b { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .6s var(--ease) both; animation-delay: var(--d); }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.res .ln { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s var(--ease) forwards; animation-delay: var(--ld); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.res .lb { opacity: 0; animation: lit .4s var(--ease) forwards; animation-delay: var(--ld); }
.res p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.res p b { color: var(--ink); font-weight: 600; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font: 500 10.5px/1 var(--mono); color: var(--ink-3); }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.key i { width: 8px; height: 8px; border-radius: 2px; }

.feel { display: grid; gap: 14px; }
.feel q { font: 700 24px/1.12 var(--display); letter-spacing: -0.025em; quotes: none; text-wrap: balance; }
.feel q::before { content: "The feeling"; display: block; font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--rose); margin-bottom: 10px; }
.ang { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ang div { padding: 12px; border-radius: 14px; background: var(--s2); display: grid; gap: 7px; font-size: 14px; line-height: 1.3; }
.said { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
.said::before { content: "Reader  "; font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.sec { display: grid; gap: 12px; }
