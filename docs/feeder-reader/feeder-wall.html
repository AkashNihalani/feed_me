<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>Feeder Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the feed as a living wall. One row per run of ten, newest on top.
   Glow = landed high, dim = landed low. Tap a post and a wave runs back through
   every post it beat. Viewpoints light the wall; the side panel (a sheet on
   phones) tells the story. Deliberately single-theme: a dark, lit wall. */
:root {
  color-scheme: dark;
  --bg: #050506;
  --panel: #0f0f12;
  --panel-2: #17171c;
  --line: #24242b;
  --ink: #fafafa;
  --ink-2: #b4b4bd;
  --ink-3: #74747f;
  --rose: #fb7185;
  --rose-deep: #e11d48;
  --rose-glow: rgba(251, 113, 133, 0.45);
  --rose-soft: rgba(251, 113, 133, 0.14);
  --white-ring: rgba(255, 255, 255, 0.92);
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 8px; }
.app { max-width: 1440px; margin: 0 auto; padding-inline: clamp(16px, 2.6vw, 36px); padding-block: 18px 120px; display: grid; gap: 22px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1.2 var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

/* bar */
.bar { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.logo { font: 700 17px/1 var(--font-display); letter-spacing: -0.02em; }
.logo i { font-style: normal; color: var(--rose); }
.feeders { display: inline-flex; gap: 6px; }
.feeders button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line); font: 500 13px/1 var(--font-body); color: var(--ink-2); }
.feeders button .av { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--rose), #7c3aed); }
.feeders button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.feeders button small { font: 400 10.5px/1 var(--font-data); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.meter { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.cells { display: grid; grid-template-columns: repeat(50, 3px); grid-auto-rows: 7px; gap: 2px; }
.cells i { background: var(--line); border-radius: 1px; }
.cells i.on { background: var(--ink-3); }
.cells i.new { background: var(--rose); }
.meter span { font: 400 11.5px/1.2 var(--font-data); color: var(--ink-2); white-space: nowrap; }
.meter b { color: var(--ink); font-weight: 600; }
.replay { font: 600 12px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; color: var(--ink); }
.replay:hover { border-color: var(--rose); }

/* stance */
.stance h1 { font: 700 clamp(34px, 6.4vw, 84px)/0.95 var(--font-display); letter-spacing: -0.045em; margin: 10px 0 12px; text-wrap: balance; max-width: 19ch; }
.stance p { margin: 0; color: var(--ink-2); font-size: clamp(15px, 1.4vw, 18px); max-width: 60ch; }
.stance .eyebrow b { color: var(--rose); font-weight: 500; }

/* lenses */
.lenses { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin-inline: -2px; }
.lenses::-webkit-scrollbar { display: none; }
.lens { flex: 0 0 auto; display: grid; gap: 6px; padding: 11px 14px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); min-width: 150px; max-width: 230px; }
.lens b { font: 700 14px/1.15 var(--font-display); letter-spacing: -0.01em; }
.lens .row { display: flex; align-items: center; gap: 8px; font: 400 11px/1 var(--font-data); color: var(--ink-3); }
.lens .bar2 { flex: 1; height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.lens .bar2 i { position: absolute; inset: 0 auto 0 0; background: var(--rose); border-radius: 2px; }
.lens[aria-pressed="true"] { border-color: var(--rose); background: linear-gradient(180deg, var(--rose-soft), var(--panel)); }
.lens.dim b { color: var(--ink-2); }
.st { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.st.settled { background: var(--ink); }
.st.tested { background: var(--ink-3); }
.st.emerging { border: 1px solid var(--ink-3); }

.lensbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 20px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--rose); }
.lensbar h2 { font: 700 clamp(18px, 2vw, 22px)/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0 0 4px; }
.lensbar .nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 12px/1.4 var(--font-data); color: var(--ink-2); }
.lensbar .nums b { color: var(--rose); font-weight: 600; }
.lensbar .nums b.w { color: var(--ink); }
.pill { font: 600 12px/1 var(--font-data); letter-spacing: 0.04em; border-radius: 999px; padding: 9px 13px; background: var(--ink); color: var(--bg); white-space: nowrap; }
.pill.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
@media (min-width: 980px) { .main { grid-template-columns: minmax(0, 1fr) 400px; } }
.wall { container: wall / inline-size; display: grid; gap: 18px; }
.run { display: grid; gap: 8px; }
.runhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 2px 2px; }
.runhead b { font: 600 11px/1 var(--font-data); letter-spacing: 0.12em; color: var(--ink-3); }
.runhead span { font: 700 15px/1.2 var(--font-display); letter-spacing: -0.01em; }
.runhead em { font: 400 11.5px/1 var(--font-data); font-style: normal; color: var(--ink-3); }
.runhead:hover span, .runhead[aria-current="true"] span { color: var(--rose); }
.runhead[aria-current="true"] b { color: var(--rose); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@container wall (min-width: 620px) { .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; } }

/* tile = mock reel cover */
.tile { position: relative; display: block; aspect-ratio: 3 / 4; border-radius: 9px; container-type: inline-size; transition: transform 0.25s ease, opacity 0.3s ease; }
.tile .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: linear-gradient(170deg, var(--g1), var(--g2)); transition: filter 0.35s ease, opacity 0.35s ease; }
.tile .face.gray { filter: grayscale(1) contrast(1.1); }
.tile svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile .cap { position: absolute; left: 8%; right: 8%; top: 9%; font: 700 clamp(5px, 10.5cqi, 17px)/1.12 var(--font-display); color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 8px rgba(0,0,0,.5); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.01em; }
.tile .badge { position: absolute; right: 5%; bottom: 5%; font: 600 clamp(6px, 11cqi, 12px)/1 var(--font-data); color: #fff; background: var(--rose-deep); padding: 3px 4px; border-radius: 4px; }
.tile .dur { position: absolute; left: 6%; bottom: 6%; font: 500 clamp(5px, 9cqi, 11px)/1 var(--font-data); color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
.tile .ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.tile .flag { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
.tile .sweep { position: absolute; inset: 0; opacity: 0; background: linear-gradient(100deg, transparent 10%, rgba(251,113,133,.85) 50%, transparent 90%); mix-blend-mode: screen; }

/* heat: where it landed */
.tile.h4 .ring { animation: beat 1.5s ease-in-out infinite; animation-delay: var(--dl); }
.tile.h3 .ring { animation: beat 2.4s ease-in-out infinite; animation-delay: var(--dl); }
.tile.h2 .ring { box-shadow: 0 0 0 1.5px var(--rose); }
.tile.h1 .face { filter: brightness(0.82) saturate(0.85); }
.tile.h1 .face.gray { filter: grayscale(1) brightness(0.8); }
.tile.h0 .face { filter: brightness(0.42) saturate(0.25); }
.tile.h0 .face.gray { filter: grayscale(1) brightness(0.42); }
@keyframes beat {
  0%, 100% { box-shadow: 0 0 0 1.5px var(--rose), 0 0 0 0 rgba(251,113,133,0); }
  50% { box-shadow: 0 0 0 2px var(--rose), 0 0 22px 4px var(--rose-glow); }
}

/* lens */
.tile.out { opacity: 0.16; }
.tile.out .ring { animation: none; box-shadow: none; }
.tile.out .face { filter: grayscale(1) brightness(0.6); }
.tile.core:not(.h4):not(.h3) .ring { box-shadow: 0 0 0 1.5px var(--rose); }
.tile.contrast { opacity: 0.9; }
.tile.contrast .ring { animation: none; box-shadow: 0 0 0 1.5px var(--white-ring); }
.tile.exc .ring { animation: none; box-shadow: none; outline: 1.5px dashed var(--rose); outline-offset: 2px; }

/* selection + resistance wave */
.tile:hover { transform: translateY(-2px); }
.tile.sel { transform: scale(1.08); z-index: 3; }
.tile.sel .ring { animation: none; box-shadow: 0 0 0 2.5px #fff, 0 10px 30px rgba(0,0,0,.6); }
.tile.beaten .flag { box-shadow: inset 0 -4px 0 var(--rose); }
.tile.beaten.wave .sweep { animation: sweep 0.7s ease-out both; animation-delay: var(--wd); }
@keyframes sweep { 0% { opacity: 0; transform: translateX(-60%); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateX(60%); } }
.tile.above .flag { box-shadow: inset 0 4px 0 #fff; }
.tile.stopper .ring { animation: none; box-shadow: 0 0 0 2px #fff; }
.tile.stopper .flag::after { content: "STOP"; position: absolute; left: 50%; top: -9px; transform: translateX(-50%); font: 700 9px/1 var(--font-data); letter-spacing: 0.1em; background: #fff; color: #000; padding: 3px 5px; border-radius: 4px; }
.tile.stopper.wave .flag::after { animation: pop 0.4s ease-out both; animation-delay: var(--wd); }
@keyframes pop { from { transform: translate(-50%, 6px) scale(0.6); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
.tile.enter { animation: drop 0.55s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--ed); }
@keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(0.92); } to { opacity: 1; transform: none; } }

.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 400 11.5px/1.3 var(--font-data); color: var(--ink-3); padding-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 16px; border-radius: 3px; display: inline-block; background: #555; }
.legend .g { box-shadow: 0 0 0 1.5px var(--rose), 0 0 10px 2px var(--rose-glow); background: #6b4a33; }
.legend .d { background: #2a2622; }
.legend .w { box-shadow: inset 0 -3px 0 var(--rose); background: #333; }
.legend .s { box-shadow: 0 0 0 1.5px #fff; background: #333; }

/* panel / sheet content */
.panel { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; scrollbar-width: thin; }
@media (max-width: 979px) { .panel { display: none; } }
.pv { display: grid; gap: 16px; }
.pv h2 { font: 700 30px/1.02 var(--font-display); letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
.pv .meta { font: 400 11.5px/1.4 var(--font-data); color: var(--ink-3); }
.hero-thumb { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: end; }
.hero-thumb .tile { aspect-ratio: 9 / 16; cursor: default; }
.hero-thumb .tile:hover { transform: none; }
.bigstat { display: grid; gap: 2px; }
.bigstat .n { font: 700 54px/0.9 var(--font-display); letter-spacing: -0.05em; }
.bigstat .n.r { color: var(--rose); }
.bigstat .l { font: 500 10.5px/1.3 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.reschip { display: inline-block; font: 600 10.5px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: #000; background: var(--rose); padding: 5px 7px; border-radius: 5px; }
.reschip.w { background: #fff; }
.resline { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.angle { display: grid; gap: 0; border-radius: 14px; background: var(--panel-2); padding: 4px 14px; }
.angle div { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.angle div:last-child { border: 0; }
.angle span:first-child { font: 500 10px/1.9 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.feeling { font: 700 22px/1.12 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.feeling::before { content: "The feeling"; display: block; font: 500 10px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--rose); margin-bottom: 8px; }
.reader { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
.reader b { color: var(--ink); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.frame { display: grid; gap: 6px; align-content: start; }
.frame .fx { aspect-ratio: 9 / 13; border-radius: 8px; position: relative; overflow: hidden; background: linear-gradient(170deg, var(--g1), var(--g2)); }
.frame .fx.gray { filter: grayscale(1); }
.frame .fx em { position: absolute; left: 6px; top: 6px; font: 600 10px/1 var(--font-data); font-style: normal; background: rgba(0,0,0,.65); color: #fff; padding: 3px 4px; border-radius: 4px; }
.frame .fx svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame p { margin: 0; font-size: 11.5px; line-height: 1.35; color: var(--ink-2); }
.sec { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 11px/1 var(--font-data); color: var(--ink-2); background: var(--panel-2); border-radius: 6px; padding: 6px 7px; }
button.chip:hover { color: var(--ink); }
button.chip.vp { border: 1px solid var(--rose-soft); color: var(--ink); }
.twin { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 12px; align-items: center; background: var(--panel-2); border-radius: 14px; padding: 12px; }
.twin p { margin: 0; font-size: 13px; color: var(--ink-2); text-align: center; }
.twin p b { display: block; font: 700 16px/1.1 var(--font-display); color: var(--ink); margin-bottom: 4px; }
.minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mini { display: grid; gap: 6px; align-content: start; }
.mini .tile { aspect-ratio: 3 / 4; }
.mini p { margin: 0; font-size: 11.5px; line-height: 1.3; color: var(--ink-2); }
.mini p b { display: block; color: var(--ink); font: 600 10.5px/1.2 var(--font-data); margin-bottom: 2px; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vs .bigstat { background: var(--panel-2); border-radius: 14px; padding: 14px; }
.vs .bigstat .n { font-size: 42px; }
.hist { display: flex; gap: 6px; }
.hist span { font: 500 10px/1 var(--font-data); padding: 5px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink-3); }
.hist span.on { color: var(--ink); border-color: var(--ink-3); }
.hist span.cur { color: #000; background: var(--rose); border-color: var(--rose); }
.moment { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
.moment .tile { aspect-ratio: 3 / 4; }
.moment p { margin: 0; font-size: 13px; color: var(--ink-2); }
.moment p b { display: block; font: 700 17px/1.15 var(--font-display); color: var(--ink); margin-bottom: 3px; }
.moment p em { font: 500 10px/1 var(--font-data); font-style: normal; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rose); display: block; margin-bottom: 6px; }
.lede { font: 500 16px/1.5 var(--font-body); color: var(--ink-2); margin: 0; }

/* mobile peek + sheet */
.peek { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 10px 10px 10px; border-radius: 16px; background: rgba(20, 20, 24, 0.92); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.peek .tile { aspect-ratio: 3 / 4; }
.peek b { display: block; font: 700 15px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.peek span { font: 400 11.5px/1.3 var(--font-data); color: var(--ink-2); }
.peek span i { font-style: normal; color: var(--rose); }
@media (min-width: 980px) { .peek, .sheet, .scrim { display: none !important; } }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 29; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 88vh; overflow: auto; background: var(--panel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); padding: 10px 18px calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.sheet .grab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; position: sticky; top: -10px; background: var(--panel); padding: 8px 0; z-index: 2; }
.sheet .grab i { width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet .grab button { font: 500 12px/1 var(--font-data); color: var(--ink-2); padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; }
.source { font: 400 11px/1.5 var(--font-data); color: var(--ink-3); max-width: 90ch; }

@media (max-width: 520px) {
  .meter { margin-left: 0; width: 100%; }
  .cells { grid-template-columns: repeat(50, minmax(0, 1fr)); flex: 1; }
  .pv h2 { font-size: 26px; }
  .hero-thumb { grid-template-columns: 112px minmax(0, 1fr); }
  .bigstat .n { font-size: 46px; }
  .lensbar { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .tile.h4 .ring, .tile.h3 .ring { animation: none; box-shadow: 0 0 0 2px var(--rose), 0 0 14px 2px var(--rose-glow); }
  .tile.beaten.wave .sweep, .tile.enter, .tile.stopper.wave .flag::after { animation: none; }
  .tile, .sheet { transition: none; }
}
</style>

<div class="app">
  <header class="bar">
    <span class="logo">Feed<i>Me</i></span>
    <div class="feeders" id="feeders" role="group" aria-label="Feeder"></div>
    <div class="meter"><div class="cells" id="cells" aria-hidden="true"></div><span id="memcap"></span></div>
    <button type="button" class="replay" id="replay">Replay memory</button>
  </header>

  <section class="stance">
    <div class="eyebrow" id="stanceEyebrow"></div>
    <h1 id="stanceHead"></h1>
    <p id="stanceBody"></p>
  </section>

  <nav class="lenses" id="lenses" aria-label="Viewpoints"></nav>
  <div class="lensbar" id="lensbar" hidden></div>

  <div class="main">
    <section>
      <div class="wall" id="wall" aria-label="Posts in memory"></div>
      <div class="legend">
        <span><i class="g"></i>Landed high</span>
        <span><i class="d"></i>Landed low</span>
        <span><i class="w"></i>Beaten by the selected post</span>
        <span><i class="s"></i>Stopped it</span>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <p class="source" id="source"></p>
</div>

<div class="peek" id="peek" hidden></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <div class="grab"><i></i><button type="button" id="closeSheet">Close</button></div>
  <div id="sheetBody"></div>

/* ---------- memory: rank in lane, resistance, viewpoint state ---------- */
function memory(f, v) {
  const n = f.runs > 1 ? Math.min(f.posts.length, v * 10) : f.posts.length;
  const ps = f.posts.slice(0, n).map((p, i) => ({ ...p, i, run: f.runs > 1 ? Math.floor(i / 10) + 1 : 1 }));
  const score = (p) => (p.pct_fixed != null ? p.pct_fixed : p.rank_final);
  [...ps].sort((a, b) => score(a) - score(b)).forEach((p, k) => { p.rank = k + 1; });
  ps.forEach((p) => { p.pct = p.pct_fixed != null ? p.pct_fixed : (p.rank / n) * 100; });
  ps.forEach((p, i) => {
    let ripple = 0, stopper = null, shortOf = 0;
    for (let j = i - 1; j >= 0; j--) { if (ps[j].pct > p.pct) ripple++; else { stopper = ps[j]; break; } }
    for (let j = i - 1; j >= 0; j--) { if (ps[j].pct < p.pct) shortOf++; else break; }
    Object.assign(p, { ripple, stopper, shortOf });
    const s = stopper;
    let label = 'In the mix';
    if (i === 0) label = 'First in memory';
    else if (ripple === i && p.pct <= 10) label = 'New ceiling';
    else if (ripple >= 5 && p.pct <= 25) label = 'Breakout';
    else if (ripple >= 4 && p.pct > 25) label = 'Broke a lull';
    else if (ripple <= 1 && p.pct <= 25 && s && s.pct <= 15) label = 'Strong company';
    else if (shortOf >= 5 && p.pct > 50) label = 'Left behind';
    let line;
    if (i === 0) line = 'Nothing earlier in memory to measure it against.';
    else if (ripple > 0 && s) line = `Beat ${ripple} in a row, then hit ${s.title} (top ${topP(s.pct)}%).`;
    else if (ripple > 0) line = `Beat all ${ripple} posts before it.`;
    else line = `Didn’t beat the post before it, ${s.title} (top ${topP(s.pct)}%).` + (shortOf > 1 ? ` ${shortOf} in a row sit above it.` : '');
    p.res = { label, line, good: ['New ceiling', 'Breakout', 'Strong company', 'Broke a lull'].includes(label) };
  });
  const byId = Object.fromEntries(ps.map((p) => [p.id, p]));
  const vps = f.viewpoints.map((vp) => {
    const ks = Object.keys(vp.history).map(Number).filter((k) => k <= v).sort((a, b) => a - b);
    if (!ks.length) return null;
    const h = vp.history[ks[ks.length - 1]];
    const keep = (a) => a.filter((id) => byId[id]);
    const core = keep(vp.core), contrast = keep(vp.contrast), exception = keep(vp.exception);
    return { ...vp, core, contrast, exception, ks, born: ks[0], status: h.status, movement: ks.includes(v) ? h.movement : 'held',
      coreMed: med(core.map((id) => byId[id].pct)), contrastMed: med(contrast.map((id) => byId[id].pct)) };
  }).filter(Boolean);
  const covered = new Set(vps.flatMap((x) => [...x.core, ...x.contrast, ...x.exception]));
  const loose = ps.filter((p) => !covered.has(p.id)).map((p) => p.id);
  const allMed = med(ps.map((p) => p.pct));
  return { posts: ps, byId, vps, loose, n: ps.length, allMed };
}

  return `<svg class="art" viewBox="0 0 30 40" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="rgba(0,0,0,.5)">${g}</g></svg>`;

function heat(p) { return p.pct <= 5 ? 4 : p.pct <= 10 ? 3 : p.pct <= 25 ? 2 : p.pct <= 50 ? 1 : 0; }

    <span class="ring"></span><span class="flag"></span></button>`;
}

/* ---------- header, stance, lenses ---------- */
function renderTop() {
  const f = F(), M = S.M;
  $('feeders').innerHTML = DATA.feeders.map((x, k) => `<button type="button" data-f="${k}" aria-pressed="${k === S.f}"><span class="av"></span>@${esc(x.handle)} <small>${x.kind}</small></button>`).join('');
  $('cells').innerHTML = Array.from({ length: f.cap }, (_, k) => { const p = M.posts[k]; return `<i class="${p ? (p.run === S.v && f.runs > 1 ? 'new' : 'on') : ''}"></i>`; }).join('');

}
function renderLenses() {
  const M = S.M;
  const chip = (id, title, status, pct, sub) => `<button type="button" class="lens ${S.lens && S.lens !== id ? 'dim' : ''}" data-lens="${id}" aria-pressed="${S.lens === id}">
      <b>${esc(title)}</b><span class="row">${status ? `<span class="st ${status}"></span>` : ''}${pct != null ? `<span class="bar2"><i style="width:${Math.max(4, 100 - pct)}%"></i></span>top ${topP(pct)}%` : esc(sub)}</span></button>`;
  $('lenses').innerHTML = M.vps.map((v) => chip(v.id, v.title, v.status, v.coreMed)).join('') +
    (M.loose.length ? chip('loose', 'Not explained yet', null, null, `${M.loose.length} posts`) : '');

    <div style="display:flex;gap:8px">${desk() ? '' : `<button type="button" class="pill" data-focuslens="${v.id}">Read</button>`}<button type="button" class="pill ghost" data-clearlens>Clear</button></div>`;
}

/* ---------- the wall ---------- */
function renderWall(enterRun) {
  const f = F(), M = S.M;
  const runs = f.runs > 1 ? S.v : 1;
  let h = '';
  for (let r = runs; r >= 1; r--) {
    const ps = M.posts.filter((p) => p.run === r).reverse();
    const hi = ps.filter((p) => p.pct <= 25).length;
    const note = f.runNotes[String(r)];
    h += `<div class="run"><button type="button" class="runhead" data-run="${r}" aria-current="${S.focus && S.focus.type === 'run' && S.focus.v === r}"><b>RUN ${r}</b><span>${esc(note.head)}</span><em>${hi} of ${ps.length} in the top 25%</em></button>
      <div class="grid">${ps.map((p, k) => tile(p, r === enterRun ? 'enter' : '', r === enterRun ? `--ed:${k * 70}ms` : '')).join('')}</div></div>`;
  }
  $('wall').innerHTML = h;
  decorate(false);
}
function decorate(wave) {
  const M = S.M; const sel = S.sel && M.byId[S.sel];

  if (S.lens === 'loose') role = { core: new Set(M.loose), contrast: new Set(), exc: new Set() };
  else if (S.lens) { const v = M.vps.find((x) => x.id === S.lens); role = { core: new Set(v.core), contrast: new Set(v.contrast), exc: new Set(v.exception) }; }
  const beaten = new Map(), above = new Set(); let stop = null;
  if (sel) {
    for (let j = sel.i - 1, k = 0; j >= sel.i - sel.ripple; j--, k++) beaten.set(M.posts[j].id, k);
    if (sel.stopper) stop = sel.stopper.id;
    for (let j = sel.i - 1; j >= sel.i - sel.shortOf; j--) above.add(M.posts[j].id);
  }
  document.querySelectorAll('#wall .tile').forEach((t) => {
    const id = t.dataset.id; const c = t.classList;
    c.toggle('sel', id === S.sel);
    c.toggle('core', !!role && role.core.has(id));
    c.toggle('contrast', !!role && role.contrast.has(id));
    c.toggle('exc', !!role && role.exc.has(id));
    c.toggle('out', !!role && !role.core.has(id) && !role.contrast.has(id) && !role.exc.has(id) && id !== S.sel);
    c.toggle('beaten', beaten.has(id));
    c.toggle('stopper', id === stop);
    c.toggle('above', above.has(id) && id !== stop);
    c.remove('wave');
    if (beaten.has(id)) t.style.setProperty('--wd', `${beaten.get(id) * 55}ms`);
    if (id === stop) t.style.setProperty('--wd', `${(sel.ripple) * 55 + 80}ms`);
  });
  if (wave && sel && !reduce) {
    void document.body.offsetWidth;
    document.querySelectorAll('#wall .tile.beaten, #wall .tile.stopper').forEach((t) => t.classList.add('wave'));
  }
}

/* ---------- panel views ---------- */
function twinOf(id) { const M = S.M; return F().twins.find((t) => (t.a === id || t.b === id) && M.byId[t.a] && M.byId[t.b]); }
function postView(p) {
  const M = S.M; const f = F();
  const vps = M.vps.filter((v) => v.core.includes(p.id) || v.contrast.includes(p.id) || v.exception.includes(p.id));
  const tw = twinOf(p.id);
  const other = tw ? M.byId[tw.a === p.id ? tw.b : tw.a] : null;
  const g = SCENES[p.scene] || SCENES.plain;
  const frames = (p.flow || []).slice(0, 8);
  const statN = p.ripple > 0 ? p.ripple : (p.shortOf > 0 ? p.shortOf : 0);
  return `<div class="pv">
    <div class="hero-thumb">${tile(p, 'static')}
      <div style="display:grid;gap:10px">
        <div class="meta">Run ${p.run} · post ${p.i + 1} · ${esc(p.age)}${p.length ? ' · ' + esc(p.length) : ''}</div>
        <h2>${esc(p.title)}</h2>
        <div><span class="reschip ${p.res.good ? '' : 'w'}">${esc(p.res.label)}</span></div>
      </div>
    </div>
    <div class="stats">
      <div class="bigstat"><span class="n ${p.pct <= 25 ? 'r' : ''}">top ${topP(p.pct)}%</span><span class="l">${p.pct_fixed != null ? `placed · ${p.views}× usual views` : `#${p.rank} of ${M.n} reels in memory`}</span></div>
      <div class="bigstat"><span class="n">${p.ripple > 0 ? p.ripple : p.i === 0 ? '–' : p.shortOf}</span><span class="l">${p.ripple > 0 ? 'beaten in a row' : p.i === 0 ? 'first post' : 'in a row above it'}</span></div>
    </div>
    <div class="resline">${esc(p.res.line)}</div>
    <p class="feeling">${esc(p.feeling)}</p>
    <div class="angle"><div><span>Speaks for</span><span>${esc(p.speaks)}</span></div><div><span>Pokes at</span><span>${esc(p.pokes)}</span></div></div>
    <p class="reader"><b>Reader.</b> ${esc(p.line)}</p>
    ${frames.length ? `<div class="sec"><span class="eyebrow">What happens · ${frames.length} beats</span><div class="strip">${frames.map((b, k) => `<div class="frame"><div class="fx ${GRAY.has(p.scene) ? 'gray' : ''}" style="--g1:${g[0]};--g2:${g[1]};filter:${GRAY.has(p.scene) ? 'grayscale(1)' : ''} hue-rotate(${k * 9}deg)">${art(p.art)}<em>${esc(b.t || '•')}</em></div><p>${esc(b.beat)}</p></div>`).join('')}</div></div>` : `<div class="sec"><span class="eyebrow">Caption</span><p class="reader">“${esc(p.hook)}”</p></div>`}
    ${other ? `<div class="sec"><span class="eyebrow">Its twin</span><div class="twin">${tile(p, 'static')}<p><b>top ${topP(p.pct)}% vs top ${topP(other.pct)}%</b>${esc(tw.line)}</p>${tile(other)}</div></div>` : ''}

    ${p.named && p.named.length ? `<div class="sec"><span class="eyebrow">Named in it</span><div class="chips">${p.named.slice(0, 12).map((n) => `<span class="chip">${esc(n)}</span>`).join('')}</div></div>` : ''}
  </div>`;
}
function minis(ids, max = 6) {
  const M = S.M;
  return `<div class="minis">${ids.slice(0, max).map((id) => { const p = M.byId[id]; return `<div class="mini">${tile(p)}<p><b>top ${topP(p.pct)}%</b>${esc(p.feeling)}</p></div>`; }).join('')}</div>`;
}
function lensView(id) {
  const M = S.M; const f = F();
  if (id === 'loose') return `<div class="pv"><span class="eyebrow">Open questions</span><h2>Not explained yet</h2><p class="lede">${M.loose.length} posts no viewpoint accounts for. The reader keeps them open instead of forcing them into a story. Some landed well. A crew at a restaurant can land without saying anything.</p>${minis(M.loose, 12)}</div>`;
  const v = M.vps.find((x) => x.id === id);
  const hist = Array.from({ length: f.runs }, (_, k) => { const r = k + 1; const h = v.history[r]; const on = r >= v.born && r <= S.v; return `<span class="${r === S.v && h ? 'cur' : on ? 'on' : ''}">R${r} ${on ? (h ? MOVE[h.movement] : 'Held') : '·'}</span>`; }).join('');
  return `<div class="pv">
    <span class="eyebrow">${STATUS[v.status]} · ${MOVE[v.movement]} at run ${S.v}</span>
    <h2>${esc(v.title)}</h2>
    <div class="vs"><div class="bigstat"><span class="n r">top ${topP(v.coreMed)}%</span><span class="l">${esc(v.coreLabel)} · ${v.core.length}</span></div>
      ${v.contrastMed != null ? `<div class="bigstat"><span class="n">top ${topP(v.contrastMed)}%</span><span class="l">${esc(v.contrastLabel)} · ${v.contrast.length}</span></div>` : `<div class="bigstat"><span class="n">top ${topP(M.allMed)}%</span><span class="l">the account overall</span></div>`}</div>
    <p class="lede">${esc(v.body)}</p>
    <div class="sec"><span class="eyebrow">Where it holds</span>${minis(v.core)}</div>
    ${v.contrast.length ? `<div class="sec"><span class="eyebrow">The other side</span>${minis(v.contrast)}</div>` : ''}
    ${v.exception.length ? `<div class="sec"><span class="eyebrow">Where it breaks</span>${minis(v.exception)}</div>` : ''}

}
function runView(r) {
  const M = S.M; const f = F();
  const ps = M.posts.filter((p) => p.run === r);
  const note = f.runNotes[String(r)];
  const wave = [...ps].sort((a, b) => b.ripple - a.ripple || a.pct - b.pct)[0];
  const miss = [...ps].sort((a, b) => b.pct - a.pct)[0];
  const pair = f.twins.find((t) => ps.some((p) => p.id === t.a) && ps.some((p) => p.id === t.b));
  const moved = M.vps.filter((v) => v.ks.includes(r));
  const atRun = memory(f, r);
  const m = (p, em, b, txt) => `<div class="moment">${tile(p)}<p><em>${em}</em><b>${b}</b>${esc(txt)}</p></div>`;
  return `<div class="pv">
    <span class="eyebrow">Run ${r} · ${ps.length} new ${f.unit}${r === f.runs ? ' · latest' : ''}</span>
    <h2>${esc(note.head)}</h2>
    <p class="lede">${esc(note.body)}</p>
    ${wave && wave.ripple ? m(wave, 'Biggest wave', `${esc(wave.title)} beat ${wave.ripple} in a row`, wave.feeling) : ''}
    ${miss && miss !== wave ? m(miss, 'The miss', `${esc(miss.title)}, top ${topP(miss.pct)}%`, miss.feeling) : ''}
    ${pair ? `<div class="sec"><span class="eyebrow">The pair that explains the run</span><div class="twin">${tile(M.byId[pair.a])}<p><b>top ${topP(M.byId[pair.a].pct)}% vs top ${topP(M.byId[pair.b].pct)}%</b>${esc(pair.line)}</p>${tile(M.byId[pair.b])}</div></div>` : ''}
    ${moved.length ? `<div class="sec"><span class="eyebrow">What the reader learned</span><div class="chips">${moved.map((v) => { const h = v.history[r]; const vv = atRun.vps.find((x) => x.id === v.id); return `<button type="button" class="chip vp" data-focuslens="${v.id}">${MOVE[h.movement]}: ${esc(vv ? vv.title : v.title)}</button>`; }).join('')}</div></div>` : ''}
  </div>`;
}
function viewHTML() {
  const fo = S.focus; const M = S.M;
  if (!fo) return runView(S.v);
  if (fo.type === 'post' && M.byId[fo.id]) return postView(M.byId[fo.id]);
  if (fo.type === 'lens' && (fo.id === 'loose' || M.vps.find((v) => v.id === fo.id))) return lensView(fo.id);
  if (fo.type === 'run' && fo.v <= S.v) return runView(fo.v);
  return runView(S.v);
}
function renderPanel() {
  if (desk()) { $('panel').innerHTML = viewHTML(); $('panel').scrollTop = 0; }
  else if ($('sheet').classList.contains('open')) { $('sheetBody').innerHTML = viewHTML(); $('sheet').scrollTop = 0; }
  document.querySelectorAll('.runhead').forEach((b) => b.setAttribute('aria-current', String(!!S.focus && S.focus.type === 'run' && S.focus.v === +b.dataset.run)));
}
function openSheet() { $('sheetBody').innerHTML = viewHTML(); $('sheet').classList.add('open'); $('scrim').classList.add('open'); $('peek').hidden = true; $('sheet').scrollTop = 0; }
function closeSheet() { $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); }
function renderPeek() {
  const p = S.sel && S.M.byId[S.sel];
  if (desk() || !p) { $('peek').hidden = true; return; }
  $('peek').hidden = false;
  $('peek').innerHTML = `${tile(p, 'static')}<div style="min-width:0"><b>${esc(p.title)}</b><span>top ${topP(p.pct)}% · <i>${esc(p.res.label)}</i> · ${p.ripple ? `beat ${p.ripple} in a row` : p.i === 0 ? 'first post' : `${p.shortOf} above it`}</span></div><button type="button" class="pill" data-openpost="${p.id}">Read</button>`;
}

/* ---------- state changes ---------- */
function load(f, v, enterRun) {
  S.f = f; S.v = v; S.M = memory(F(), v);
  if (S.lens && S.lens !== 'loose' && !S.M.vps.find((x) => x.id === S.lens)) S.lens = null;
  if (S.sel && !S.M.byId[S.sel]) S.sel = null;
  renderTop(); renderLenses(); renderWall(enterRun); renderPanel(); renderPeek();
}
function selectPost(id, fromPanel) {
  S.sel = id; S.focus = { type: 'post', id };
  decorate(true); renderPanel(); renderPeek();
  if (fromPanel) { const t = document.querySelector(`#wall .tile[data-id="${id}"]`); if (t && desk()) t.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }
}
function setLens(id, focus) {
  S.lens = S.lens === id && !focus ? null : id;
  if (S.lens) S.focus = { type: 'lens', id: S.lens };
  renderLenses(); decorate(false); renderPanel();
}
document.addEventListener('click', (e) => {
  const q = (sel) => e.target.closest(sel);
  let b;
  if ((b = q('[data-f]'))) { stopPlay(); S.lens = null; S.sel = null; S.focus = null; closeSheet(); const k = +b.dataset.f; load(k, DATA.feeders[k].runs); return; }
  if ((b = q('#replay'))) { S.playing ? stopPlay() : startPlay(); return; }
  if ((b = q('[data-openpost]'))) { S.focus = { type: 'post', id: b.dataset.openpost }; openSheet(); return; }
  if ((b = q('[data-clearlens]'))) { S.lens = null; renderLenses(); decorate(false); if (S.focus && S.focus.type === 'lens') { S.focus = null; renderPanel(); } return; }
  if ((b = q('[data-focuslens]'))) { setLens(b.dataset.focuslens, true); if (!desk()) openSheet(); return; }
  if ((b = q('[data-lens]'))) { setLens(b.dataset.lens, false); return; }
  if ((b = q('[data-run]'))) { S.focus = { type: 'run', v: +b.dataset.run }; renderPanel(); if (!desk()) openSheet(); return; }
  if ((b = q('#closeSheet')) || (b = q('#scrim'))) { closeSheet(); renderPeek(); return; }
  if ((b = q('.tile[data-id]'))) {
    if (b.classList.contains('static')) return;
    const inSheet = !!e.target.closest('#sheet'), inPanel = !!e.target.closest('#panel');
    selectPost(b.dataset.id, inPanel || inSheet);
    if (inSheet) { $('sheetBody').innerHTML = viewHTML(); $('sheet').scrollTop = 0; $('peek').hidden = true; }
    return;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSheet(); renderPeek(); }
  const t = e.target.closest && e.target.closest('#wall .tile');
  if (t && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault(); const p = S.M.byId[t.dataset.id];
    const j = Math.max(0, Math.min(S.M.n - 1, p.i + (e.key === 'ArrowLeft' ? 1 : -1)));
    const id = S.M.posts[j].id; selectPost(id); const nt = document.querySelector(`#wall .tile[data-id="${id}"]`); if (nt) nt.focus();
  }
});
function startPlay() {
  const f = F(); if (f.runs < 2) return;
  S.playing = true; S.sel = null; S.lens = null; closeSheet(); let v = 1;
  S.focus = { type: 'run', v }; load(S.f, v, v);
  S.timer = setInterval(() => { v++; if (v > f.runs) { stopPlay(); return; } S.focus = { type: 'run', v }; load(S.f, v, v); }, 2600);
  $('replay').textContent = 'Stop';
}
function stopPlay() { clearInterval(S.timer); S.timer = null; if (S.playing) { S.playing = null; $('replay').textContent = 'Replay memory'; } }
let rz; let wasDesk = desk();
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (desk() !== wasDesk) { wasDesk = desk(); closeSheet(); renderLenses(); renderPanel(); renderPeek(); } }, 120); });

/* first frame: latest run, the Andheri / UP pair told by the run story */
load(0, DATA.feeders[0].runs);
</script>
