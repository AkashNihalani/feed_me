<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>Feeder Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: three screens (Now, Series, Grid) under one sticky bar; a floating tab
   bar on phones. Detail opens as an overlay that the tapped cover flies into.
   One visual rule: higher = landed better, rose = top of this account.
   Motion runs on generated spring curves (see SP in the script).
   Deliberately single-theme: FeedMe dark. */
:root {
  color-scheme: dark;
  --bg: #050506;
  --s1: #0c0c0f;
  --s2: #141418;
  --s3: #1d1d23;
  --hair: rgba(255, 255, 255, 0.07);
  --hair-2: rgba(255, 255, 255, 0.13);
  --ink: #fafafa;
  --ink-2: #a5a5ae;
  --ink-3: #65656f;
  --rose: #fb7185;
  --rose-deep: #e11d48;
  --rose-glow: rgba(251, 113, 133, 0.45);
  --rose-wash: rgba(251, 113, 133, 0.12);
  --b3: #fb7185;
  --b2: #b9566a;
  --b1: #6f6f79;
  --b0: #2c2c33;
  --down: #e4e4e7;
  --out: cubic-bezier(0.22, 1, 0.36, 1);
  --sp-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --sp-pop-d: 620ms;
  --sp-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --sp-soft-d: 760ms;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gut: clamp(16px, 2.6vw, 36px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 10px; }
.k { font: 600 10.5px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.k b { color: var(--rose); font-weight: 600; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gut); }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -0.035em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* reveal on scroll */
[data-rv] { opacity: 0; translate: 0 22px; filter: blur(8px); transition: opacity .7s var(--out), translate var(--sp-soft-d) var(--sp-soft), filter .6s var(--out); transition-delay: calc(var(--rd, 0) * 1ms); }
[data-rv].in { opacity: 1; translate: 0 0; filter: blur(0); }

/* ripple */
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); transform: scale(0); z-index: 5; }

/* ---------- bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(5, 5, 6, 0.55); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-bottom: 1px solid transparent; transition: background .4s var(--out), border-color .4s var(--out); }
.top.scrolled { background: rgba(5, 5, 6, 0.86); border-color: var(--hair); }
.top .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; height: 62px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { font: 700 18px/1 var(--display); letter-spacing: -0.03em; flex: none; }
.logo i { font-style: normal; color: var(--rose); }
.seg { position: relative; display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--s2); min-width: 0; isolation: isolate; }
.seg button { flex-shrink: 0; position: relative; z-index: 1; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font: 600 13px/1 var(--body); color: var(--ink-2); white-space: nowrap; transition: color .35s var(--out); }
.seg button:hover { color: var(--ink); }
.seg button[aria-current="true"] { color: var(--bg); }
.seg button em { font: 600 10px/1 var(--mono); font-style: normal; opacity: .6; }
.seg .ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--ink); box-shadow: 0 4px 18px rgba(255,255,255,.12); }
.who button { padding: 5px 12px 5px 5px; }
.av { width: 22px; height: 22px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #fb7185, #7c3aed); }
.av.l { background: linear-gradient(135deg, #f9a8d4, #be123c); }
.meta { justify-self: end; font: 500 11.5px/1 var(--mono); color: var(--ink-3); white-space: nowrap; }
.meta b { color: var(--ink-2); font-weight: 600; }
.tabbar { display: none; }
@media (max-width: 860px) {
  .top .wrap { grid-template-columns: minmax(0, 1fr); height: 56px; }
  .tabs-top, .logo, .meta { display: none !important; }
  .tabbar { display: block; position: fixed; z-index: 30; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; width: min(420px, calc(100% - 24px)); }
  .tabbar .seg { width: 100%; padding: 5px; background: rgba(26, 26, 31, 0.78); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 0 0 1px var(--hair-2); }
  .tabbar .seg button { flex: 1; justify-content: center; flex-direction: column; gap: 4px; padding: 8px 4px 7px; font-size: 11px; }
  .tabbar .seg .ind { top: 5px; bottom: 5px; }
  .tabbar svg { width: 19px; height: 19px; }
  main { padding-bottom: 110px !important; }
}
@media (max-width: 420px) { .who .h { max-width: 92px; overflow: hidden; text-overflow: ellipsis; } }

main { padding-block: 22px 80px; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
.sec, .news, .acct, .grdhd { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.runsw-wrap, .ctrl, .hcopy, .stage { min-width: 0; }
.foot { font: 500 11px/1.6 var(--mono); color: var(--ink-3); max-width: 90ch; margin: 0; }

/* ---------- cover tile ---------- */
.tile { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; container-type: inline-size; transition: scale .5s var(--sp-pop), translate .5s var(--sp-pop), opacity .4s var(--out); }
.tile .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: radial-gradient(120% 70% at 50% 72%, rgba(255,255,255,.14), transparent 60%), linear-gradient(168deg, var(--g1), var(--g2)); transition: transform .45s var(--out), filter .4s var(--out); transform-style: preserve-3d; }
.tile .face::before { content: ""; position: absolute; inset: 0; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>"); opacity: .14; mix-blend-mode: overlay; }
.tile .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, transparent 34%, transparent 58%, rgba(0,0,0,.62) 100%); }
.tile .face.gray { filter: grayscale(1) contrast(1.08); }
.tile svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile .cap { position: absolute; z-index: 1; left: 9%; right: 9%; top: 9%; font: 700 clamp(5px, 10cqi, 22px)/1.12 var(--display); color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.7); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.01em; }
.tile .bl, .tile .br { position: absolute; z-index: 1; bottom: 6%; font: 600 clamp(5px, 9cqi, 12px)/1 var(--mono); color: rgba(255,255,255,.9); }
.tile .bl { left: 7%; }
.tile .br { right: 6%; font: 700 clamp(6px, 10cqi, 13px)/1 var(--display); padding: 2px 4px; border-radius: 4px; }
.tile .br.b3 { background: var(--b3); color: #000; }
.tile .br.b2 { background: var(--b2); color: #fff; }
.tile .glare { position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.32), transparent 48%); opacity: 0; transition: opacity .35s var(--out); mix-blend-mode: soft-light; pointer-events: none; }
.tile .ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; transition: box-shadow .4s var(--out); }
.tile.b3 .ring { animation: breathe 2.6s ease-in-out infinite; animation-delay: var(--gd); }
.tile.b2 .ring { box-shadow: 0 0 0 1.5px var(--b2); }
.tile.b1 .face { filter: brightness(.8) saturate(.8); }
.tile.b0 .face { filter: brightness(.48) saturate(.25); }
.tile.b1 .face.gray { filter: grayscale(1) brightness(.78); }
.tile.b0 .face.gray { filter: grayscale(1) brightness(.46); }
.tile.lit .face { filter: none; }
.tile.lit .face.gray { filter: grayscale(1) contrast(1.08); }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 1.5px var(--rose), 0 0 0 0 rgba(251,113,133,0); } 50% { box-shadow: 0 0 0 2px var(--rose), 0 0 26px 3px var(--rose-glow); } }
@media (hover: hover) and (pointer: fine) {
  button.tile:hover { scale: 1.035; z-index: 4; }
  button.tile:hover .glare { opacity: 1; }
  button.tile:hover .ring { box-shadow: 0 0 0 1.5px var(--hair-2), 0 18px 40px rgba(0,0,0,.55); }
  button.tile.b3:hover .ring, button.tile.b2:hover .ring { box-shadow: 0 0 0 2px var(--rose), 0 18px 44px rgba(225,29,72,.35); animation: none; }
}
button.tile:active { scale: .95; }
.tile.cur .ring { animation: none; box-shadow: 0 0 0 2.5px var(--ink); }

/* podium: covers sit higher when they landed better */
.pod { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--pg, 6px); height: var(--ph, 190px); margin-right: 50px; }
.pod .gl { position: absolute; left: 0; right: -50px; height: 0; top: calc(var(--gy) * (100% - var(--th, 0px)) / 100 + var(--th, 0px) / 2); border-top: 1px dashed rgba(255,255,255,.08); pointer-events: none; }
.pod .gl span { position: absolute; right: 0; top: -6px; background: var(--s1); padding-left: 4px; font: 600 9.5px/1 var(--mono); color: var(--ink-3); letter-spacing: .08em; }
.pod .gl.t25 { border-top-color: rgba(251,113,133,.28); }
.pod .gl.t25 span { color: var(--rose); }
.pod .col { position: relative; }
.pod .col::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 1px; height: calc((100 - var(--y)) * 1%); background: linear-gradient(0deg, var(--hair-2), transparent); transform-origin: 50% 100%; animation: stem .9s var(--out) backwards; animation-delay: calc(var(--k) * 45ms + 60ms); }
@keyframes stem { from { transform: scaleY(0); } }
.pod .tile { transition: scale .5s var(--sp-pop), translate .7s var(--out), opacity .4s var(--out); position: absolute; left: 50%; width: min(100%, var(--tw, 96px)); top: calc(var(--y) * 1%); transform: translate(-50%, calc(var(--y) * -1%)); translate: 0 calc(var(--par, 0) * var(--pz, 0) * 1px); animation: podrise var(--sp-pop-d) var(--sp-pop) backwards; animation-delay: calc(var(--k) * 55ms + 140ms); }
@keyframes podrise { from { translate: 0 70px; opacity: 0; scale: .7; } }
.podd { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--pg, 6px); margin-top: 10px; margin-right: 50px; }
.pod .gl.t10 span { display: none; }
.stage .pod .gl.t10 span { display: block; }
.box .pod .gl span, .sec .pod .gl span { background: var(--s1); }
.podd span { font: 600 9.5px/1.2 var(--mono); color: var(--ink-3); text-align: center; white-space: nowrap; overflow: hidden; }
.podd span.hi { color: var(--rose); }

/* fan of covers */
.fan { position: relative; width: var(--fw, 64px); aspect-ratio: 3 / 3.4; flex: none; }
.fan .tile { position: absolute; left: 50%; bottom: 0; width: 72%; translate: -50% 0; transform-origin: 50% 100%; transition: rotate .6s var(--sp-pop), translate .6s var(--sp-pop), scale .5s var(--sp-pop); }
.fan .tile:nth-child(1) { rotate: -9deg; translate: -78% 0; }
.fan .tile:nth-child(2) { rotate: 9deg; translate: -22% 0; }
.fan .tile:nth-child(3) { rotate: 0deg; z-index: 2; }
.spread .fan .tile:nth-child(1), .fan.spread .tile:nth-child(1) { rotate: -14deg; translate: -88% -2px; }
.spread .fan .tile:nth-child(2), .fan.spread .tile:nth-child(2) { rotate: 14deg; translate: -12% -2px; }
.spread .fan .tile:nth-child(3), .fan.spread .tile:nth-child(3) { translate: -50% -6px; }

/* ---------- NOW ---------- */
.runsw-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.runsw { overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.runsw::-webkit-scrollbar { display: none; }
.runsw button { flex: none; }
.runsw .live { width: 6px; height: 6px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 3px var(--rose-wash); animation: live 2s ease-in-out infinite; }
@keyframes live { 50% { box-shadow: 0 0 0 6px rgba(251,113,133,0); } }
.basis { font: 500 11px/1.4 var(--mono); color: var(--ink-3); text-align: right; }
.hero2 { position: relative; display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.25fr); gap: 36px; align-items: end; padding: 28px; border-radius: 28px; background: radial-gradient(90% 120% at 85% 0%, rgba(251,113,133,.10), transparent 60%), var(--s1); box-shadow: inset 0 0 0 1px var(--hair); overflow: hidden; touch-action: pan-y; }
.hcopy { display: grid; gap: 16px; align-content: end; }
.hcopy h1 { font-size: clamp(32px, 4.2vw, 56px); line-height: .96; letter-spacing: -0.045em; }
.hcopy p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.62; }
.hcopy p b { color: var(--ink); font-weight: 600; }
.score { display: flex; align-items: center; gap: 14px; }
.score svg { width: 64px; height: 64px; flex: none; rotate: -90deg; }
.score .trk { stroke: var(--s3); }
.score .val { stroke: var(--rose); stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--c); transition: stroke-dashoffset 1.4s var(--out) .25s; }
.score.in .val { stroke-dashoffset: calc(var(--c) * (1 - var(--v))); }
.score strong { font: 700 34px/1 var(--display); letter-spacing: -0.04em; }
.score strong small { font-size: .5em; color: var(--ink-3); letter-spacing: 0; }
.score .cap2 { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.stage { position: relative; padding-top: 70px; }
.stage .pod { --ph: 330px; --tw: 92px; --pg: 8px; }
.stage .axis { margin-right: 50px; display: flex; justify-content: space-between; margin-top: 10px; font: 600 10px/1 var(--mono); color: var(--ink-3); letter-spacing: .08em; }
.callout { width: max-content; position: absolute; z-index: 6; translate: -50% -100%; transform: translateY(calc(var(--par, 0) * var(--cz, 0) * 1px)); transition: transform .7s var(--out); max-width: 200px; padding: 8px 10px; border-radius: 12px; background: rgba(250,250,250,.96); color: #09090b; font: 600 12px/1.25 var(--display); letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(0,0,0,.45); pointer-events: none; animation: callin .7s var(--sp-pop) backwards; animation-delay: .9s; }
.callout em { display: block; font: 700 9.5px/1 var(--mono); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--rose-deep); margin-bottom: 4px; }
.callout.low em { color: #52525b; }
.callout::after { content: ""; position: absolute; left: var(--cx, 50%); bottom: -5px; width: 10px; height: 10px; margin-left: -5px; background: inherit; rotate: 45deg; border-radius: 2px; }
@keyframes callin { from { opacity: 0; translate: -50% -80%; scale: .85; } }
.moments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card { position: relative; overflow: hidden; display: grid; gap: 14px; align-content: start; padding: 18px; border-radius: 22px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); cursor: pointer; transition: background .3s var(--out), scale .5s var(--sp-pop), box-shadow .3s var(--out); }
.card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(251,113,133,.10), transparent 60%); opacity: 0; transition: opacity .4s var(--out); pointer-events: none; }
@media (hover: hover) { .card:hover { background: var(--s2); box-shadow: inset 0 0 0 1px var(--hair-2); } .card:hover::before { opacity: 1; } }
.card:active { scale: .985; }
.card h3 { font-size: 19px; line-height: 1.18; letter-spacing: -0.025em; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.card p b { color: var(--ink); font-weight: 600; }
.mo-top { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: end; }
.mo-top .big { font: 700 40px/.9 var(--display); letter-spacing: -0.05em; }
.mo-top .big.r { color: var(--rose); }
.mo-top .big small { font-size: .45em; }
.mo .res { padding: 0; background: none; }
.pair .pod { --ph: 150px; --tw: 76px; }
.news { display: grid; gap: 14px; }
.news .row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gut)); padding: 4px var(--gut) 8px; scroll-snap-type: x proximity; }
.news .row::-webkit-scrollbar { display: none; }
.nchip { scroll-snap-align: start; flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 18px; background: var(--s1); box-shadow: inset 0 0 0 1px var(--hair); position: relative; overflow: hidden; transition: background .3s var(--out), scale .5s var(--sp-pop); }
.nchip:hover { background: var(--s2); }
.nchip:active { scale: .97; }
.nchip .fan { --fw: 46px; }
.nchip b { display: block; font: 600 14px/1.2 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
.nchip span.st { display: inline-flex; gap: 6px; align-items: center; margin-top: 5px; }
.mv { font: 700 10px/1 var(--mono); letter-spacing: .06em; padding: 4px 6px; border-radius: 5px; white-space: nowrap; }
.mv.up { color: var(--rose); background: var(--rose-wash); }
.mv.down { color: var(--ink-2); background: var(--s3); }
.mv.new { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.mv.same { color: var(--ink-3); background: var(--s2); }
.mv.again { color: var(--ink-2); background: var(--s2); }
.acct { display: grid; gap: 14px; }
.acct .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ac { grid-template-columns: minmax(0, 1fr) auto; }
.ac .fan { --fw: 70px; margin: 4px 6px 0 18px; }
.ac .tx { display: grid; gap: 10px; }
.ac .big { font: 700 30px/1 var(--display); letter-spacing: -0.04em; }
.ac .big.r { color: var(--rose); }
.sech { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.sech h2 { font-size: 22px; letter-spacing: -0.03em; }

@media (max-width: 860px) {
  .hero2 { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 16px; gap: 6px; border-radius: 24px; margin-inline: -4px; }
  .stage { order: -1; padding-top: 64px; }
  .stage .pod { --ph: 230px; --tw: 60px; --pg: 4px; }
  .callout { max-width: 150px; font-size: 11px; padding: 7px 8px; }
  .moments { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 84%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: calc(-1 * var(--gut)); padding: 4px var(--gut) 6px; scroll-padding-inline: var(--gut); }
  .moments::-webkit-scrollbar { display: none; }
  .moments .card { scroll-snap-align: start; }
  .acct .grid3 { grid-template-columns: minmax(0, 1fr); }
  .basis { display: none; }
}
.dots { display: none; justify-content: center; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--s3); transition: width .4s var(--sp-pop), background .3s; }
.dots i.on { width: 18px; background: var(--ink-2); }
@media (max-width: 860px) { .dots { display: flex; } }

/* ---------- SERIES chart ---------- */
.serhd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
.serhd h1, .grdhd h1 { font-size: clamp(32px, 4.4vw, 56px); line-height: .96; letter-spacing: -0.045em; margin-top: 10px; }
.serhd p, .grdhd p { margin: 10px 0 0; color: var(--ink-2); max-width: 60ch; }
.scrub { display: flex; align-items: center; gap: 8px; }
.ib { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); color: var(--ink-2); position: relative; overflow: hidden; transition: background .2s, color .2s, scale .45s var(--sp-pop); flex: none; }
.ib:hover { background: var(--s3); color: var(--ink); }
.ib:active { scale: .9; }
.ib svg { width: 15px; height: 15px; }
.ib.on { background: var(--rose); color: #000; }
.chart { display: grid; gap: 8px; }

function seriesView(s) {

let ovOpen = false;
const ovTitle = (e) => (e.type === 'post' ? full().byId[e.id].label : full().sById[e.id].name);

function flyClone(srcEl, from, to, done, radius = ['10px', '18px']) {

(function drag() {

const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); countUps(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });
