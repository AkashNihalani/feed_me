<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>Feeder Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one wall. A hero with the reader's dispatch and a pulse chart of every reel
   in memory, then the feed itself, newest first, runs as dividers. Insight comes
   as layers over the feed (Rank, Why, Bits), never
   as separate pages. The reader's dispatch sits above it and a floating reader
   card carries the take for whatever is tapped. Detail opens as an overlay the
   tapped cover flies into. Motion runs on generated spring curves (SP).
   Deliberately single-theme: FeedMe dark. */
:root {
  color-scheme: dark;
  --bg: #050506;
  --s1: #0c0c0f;
  --s2: #141418;
  --s3: #1d1d23;
  --hair: rgba(255, 255, 255, 0.07);
  --hair-2: rgba(255, 255, 255, 0.13);
  --ink: #fafafa;
  --ink-2: #a5a5ae;
  --ink-3: #65656f;
  --rose: #fb7185;
  --rose-deep: #e11d48;
  --rose-glow: rgba(251, 113, 133, 0.45);
  --rose-wash: rgba(251, 113, 133, 0.12);
  --b3: #fb7185;
  --b2: #b9566a;
  --b1: #6f6f79;
  --b0: #2c2c33;
  --down: #e4e4e7;
  --out: cubic-bezier(0.22, 1, 0.36, 1);
  --sp-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --sp-pop-d: 620ms;
  --sp-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --sp-soft-d: 760ms;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gut: clamp(16px, 2.6vw, 36px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 10px; }
.k { font: 600 10.5px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.k b { color: var(--rose); font-weight: 600; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--gut); }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -0.035em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* reveal on scroll */
[data-rv] { opacity: 0; translate: 0 22px; filter: blur(8px); transition: opacity .7s var(--out), translate var(--sp-soft-d) var(--sp-soft), filter .6s var(--out); transition-delay: calc(var(--rd, 0) * 1ms); }
[data-rv].in { opacity: 1; translate: 0 0; filter: blur(0); }

/* ripple */
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); transform: scale(0); z-index: 5; }

/* ---------- bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(5, 5, 6, 0.55); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-bottom: 1px solid transparent; transition: background .4s var(--out), border-color .4s var(--out); }
.top.scrolled { background: rgba(5, 5, 6, 0.86); border-color: var(--hair); }
.top .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; height: 62px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { font: 700 18px/1 var(--display); letter-spacing: -0.03em; flex: none; }
.logo i { font-style: normal; color: var(--rose); }
.seg { position: relative; display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--s2); min-width: 0; isolation: isolate; }
.seg button { flex-shrink: 0; position: relative; z-index: 1; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font: 600 13px/1 var(--body); color: var(--ink-2); white-space: nowrap; transition: color .35s var(--out); }
.seg button:hover { color: var(--ink); }
.seg button[aria-current="true"] { color: var(--bg); }
.seg button em { font: 600 10px/1 var(--mono); font-style: normal; opacity: .6; }
.seg .ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--ink); box-shadow: 0 4px 18px rgba(255,255,255,.12); }
.who button { padding: 5px 12px 5px 5px; }
.av { width: 22px; height: 22px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #fb7185, #7c3aed); }
.av.l { background: linear-gradient(135deg, #f9a8d4, #be123c); }
.meta { justify-self: end; font: 500 11.5px/1 var(--mono); color: var(--ink-3); white-space: nowrap; }
.meta b { color: var(--ink-2); font-weight: 600; }
.tabbar { display: none; }
@media (max-width: 860px) {
  .top .wrap { grid-template-columns: minmax(0, 1fr); height: 56px; }
  .tabs-top, .logo, .meta { display: none !important; }
  .tabbar { display: block; position: fixed; z-index: 30; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; width: min(420px, calc(100% - 24px)); }
  .tabbar .seg { width: 100%; padding: 5px; background: rgba(26, 26, 31, 0.78); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 0 0 1px var(--hair-2); }
  .tabbar .seg button { flex: 1; justify-content: center; flex-direction: column; gap: 4px; padding: 8px 4px 7px; font-size: 11px; }
  .tabbar .seg .ind { top: 5px; bottom: 5px; }
  .tabbar svg { width: 19px; height: 19px; }
  main { padding-bottom: 110px !important; }
}
@media (max-width: 420px) { .who .h { max-width: 92px; overflow: hidden; text-overflow: ellipsis; } }

main { padding-block: 22px 80px; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
.sec, .news, .acct, .grdhd { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.runsw-wrap, .ctrl, .hcopy, .stage { min-width: 0; }
.foot { font: 500 11px/1.6 var(--mono); color: var(--ink-3); max-width: 90ch; margin: 0; }

/* ---------- cover tile ---------- */
.tile { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; container-type: inline-size; transition: scale .5s var(--sp-pop), translate .5s var(--sp-pop), opacity .4s var(--out); }
.tile .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; outline: 1px solid rgba(255,255,255,.08); outline-offset: -1px; background: radial-gradient(120% 70% at 50% 72%, rgba(255,255,255,.14), transparent 60%), linear-gradient(168deg, var(--g1), var(--g2)); transition: transform .45s var(--out), filter .4s var(--out); transform-style: preserve-3d; }
.tile .face::before { content: ""; position: absolute; inset: 0; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>"); opacity: .14; mix-blend-mode: overlay; }
.tile .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, transparent 34%, transparent 58%, rgba(0,0,0,.62) 100%); }
.tile .face.gray { filter: grayscale(1) contrast(1.08); }
.tile svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile .cap { position: absolute; z-index: 1; left: 9%; right: 9%; top: 9%; font: 700 clamp(6px, 12cqi, 28px)/1.06 var(--display); color: #fff; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.85); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.01em; }
.tile .bl, .tile .br { position: absolute; z-index: 1; bottom: 6%; font: 600 clamp(5px, 9cqi, 12px)/1 var(--mono); color: rgba(255,255,255,.9); }
.tile .bl { left: 7%; }
.tile .br { right: 6%; font: 700 clamp(6px, 10cqi, 13px)/1 var(--display); padding: 2px 4px; border-radius: 4px; }
.tile .br.b3 { background: var(--b3); color: #000; }
.tile .br.b2 { background: var(--b2); color: #fff; }
.tile .glare { position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.32), transparent 48%); opacity: 0; transition: opacity .35s var(--out); mix-blend-mode: soft-light; pointer-events: none; }
.tile .ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; transition: box-shadow .4s var(--out); }
.tile.b3 .ring { animation: breathe 2.6s ease-in-out infinite; animation-delay: var(--gd); }
.tile.b2 .ring { box-shadow: 0 0 0 1.5px var(--b2); }
.tile.b1 .face { filter: brightness(.8) saturate(.8); }
.tile.b0 .face { filter: brightness(.48) saturate(.25); }
.tile.b1 .face.gray { filter: grayscale(1) brightness(.78); }
.tile.b0 .face.gray { filter: grayscale(1) brightness(.46); }
.tile.lit .face { filter: none; }
.tile.lit .face.gray { filter: grayscale(1) contrast(1.08); }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 1.5px var(--rose), 0 0 0 0 rgba(251,113,133,0); } 50% { box-shadow: 0 0 0 2px var(--rose), 0 0 26px 3px var(--rose-glow); } }
@media (hover: hover) and (pointer: fine) {
  button.tile:hover { scale: 1.035; z-index: 4; }
  button.tile:hover .glare { opacity: 1; }
  button.tile:hover .ring { box-shadow: 0 0 0 1.5px var(--hair-2), 0 18px 40px rgba(0,0,0,.55); }
  button.tile.b3:hover .ring, button.tile.b2:hover .ring { box-shadow: 0 0 0 2px var(--rose), 0 18px 44px rgba(225,29,72,.35); animation: none; }
}
button.tile:active { scale: .95; }
.tile.cur .ring { animation: none; box-shadow: 0 0 0 2.5px var(--ink); }

/* podium: covers sit higher when they landed better */
.pod { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--pg, 6px); height: var(--ph, 190px); margin-right: 50px; }
.pod .gl { position: absolute; left: 0; right: -50px; height: 0; top: calc(var(--gy) * (100% - var(--th, 0px)) / 100 + var(--th, 0px) / 2); border-top: 1px dashed rgba(255,255,255,.08); pointer-events: none; }
.pod .gl span { position: absolute; right: 0; top: -6px; background: var(--s1); padding-left: 4px; font: 600 9.5px/1 var(--mono); color: var(--ink-3); letter-spacing: .08em; }
.pod .gl.t25 { border-top-color: rgba(251,113,133,.28); }
.pod .gl.t25 span { color: var(--rose); }
.pod .col { position: relative; }
.pod .col::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 1px; height: calc((100 - var(--y)) * 1%); background: linear-gradient(0deg, var(--hair-2), transparent); transform-origin: 50% 100%; animation: stem .9s var(--out) backwards; animation-delay: calc(var(--k) * 45ms + 60ms); }
@keyframes stem { from { transform: scaleY(0); } }
.pod .tile { transition: scale .5s var(--sp-pop), translate .7s var(--out), opacity .4s var(--out); position: absolute; left: 50%; width: min(100%, var(--tw, 96px)); top: calc(var(--y) * 1%); transform: translate(-50%, calc(var(--y) * -1%)); translate: 0 calc(var(--par, 0) * var(--pz, 0) * 1px); animation: podrise var(--sp-pop-d) var(--sp-pop) backwards; animation-delay: calc(var(--k) * 55ms + 140ms); }
@keyframes podrise { from { translate: 0 70px; opacity: 0; scale: .7; } }
.podd { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--pg, 6px); margin-top: 10px; margin-right: 50px; }
.pod .gl.t10 span { display: none; }
.stage .pod .gl.t10 span { display: block; }
.box .pod .gl span, .sec .pod .gl span { background: var(--s1); }
.podd span { font: 600 9.5px/1.2 var(--mono); color: var(--ink-3); text-align: center; white-space: nowrap; overflow: hidden; }
.podd span.hi { color: var(--rose); }

/* fan of covers */
.stack { position: relative; display: block; width: var(--sw, 72px); flex: none; padding-top: 10px; }
.stack .e { position: absolute; top: 0; height: 42%; border-radius: 9px; background: linear-gradient(168deg, var(--g1), var(--g2)); filter: brightness(.5) saturate(.75); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: translate .6s var(--sp-pop), filter .4s var(--out); }
.stack .e1 { left: 7%; right: 7%; top: 5px; z-index: 1; }
.stack .e2 { left: 15%; right: 15%; top: 0; filter: brightness(.32) saturate(.6); }
.stack > .tile { z-index: 2; border-radius: 11px; box-shadow: 0 14px 30px rgba(0,0,0,.55); }
.stack .cnt { position: absolute; z-index: 3; right: -7px; bottom: -7px; font: 700 11px/1 var(--mono); padding: 5px 7px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 0 0 3px var(--s1); transition: scale .5s var(--sp-pop); }
@media (hover: hover) {
  .srow:hover .stack .e1, .card:hover .stack .e1, .nchip:hover .stack .e1 { translate: 0 -5px; filter: brightness(.7) saturate(.9); }
  .srow:hover .stack .e2, .card:hover .stack .e2, .nchip:hover .stack .e2 { translate: 0 -10px; filter: brightness(.5) saturate(.8); }
  .srow:hover .stack .cnt, .card:hover .stack .cnt, .nchip:hover .stack .cnt { scale: 1.12; }
}

.ib { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); color: var(--ink-2); position: relative; overflow: hidden; transition: background .2s, color .2s, scale .45s var(--sp-pop); flex: none; }
.ib:hover { background: var(--s3); color: var(--ink); }
.ib:active { scale: .9; }
.ib svg { width: 15px; height: 15px; }
.ib.on { background: var(--rose); color: #000; }
.chip { position: relative; overflow: hidden; flex: none; display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px/1.2 var(--body); padding: 8px 12px; border-radius: 999px; background: var(--s2); color: var(--ink-2); transition: background .25s, color .25s, scale .45s var(--sp-pop); }
.chip:hover { background: var(--s3); color: var(--ink); }
.chip:active { scale: .94; }
.chip em { font: 600 10.5px/1 var(--mono); font-style: normal; color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] em { color: rgba(5,5,6,.55); }
.chip.vpc { box-shadow: inset 0 0 0 1px rgba(251,113,133,.4); color: var(--ink); }
/* ---------- overlay ---------- */
.ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none; }
.ov:not(.on) { visibility: hidden; }
.ov.on { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%); opacity: 0; }
.sheet { position: relative; width: min(820px, calc(100vw - 48px)); max-height: min(88vh, 900px); display: flex; flex-direction: column; border-radius: 26px; background: var(--s1); box-shadow: 0 40px 100px rgba(0,0,0,.65), inset 0 0 0 1px var(--hair-2); opacity: 0; overflow: hidden; }
.shd { position: relative; z-index: 3; flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid transparent; transition: border-color .3s, background .3s; }
.shd.stuck { border-color: var(--hair); background: rgba(12,12,15,.9); }
.shd .mini { font: 600 14px/1.2 var(--display); letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; translate: 0 6px; transition: opacity .3s var(--out), translate .4s var(--out); text-align: center; }
.shd.stuck .mini { opacity: 1; translate: 0 0; }
.shd .acts { display: flex; gap: 6px; }
.back { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 8px; border-radius: 999px; background: var(--s2); font: 600 12.5px/1 var(--body); color: var(--ink-2); position: relative; overflow: hidden; transition: background .2s, color .2s; max-width: 200px; }
.back:hover { background: var(--s3); color: var(--ink); }
.back svg { width: 14px; height: 14px; flex: none; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grab { display: none; }
.obody { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 6px 26px 30px; scrollbar-width: none; touch-action: pan-y; }
.obody::-webkit-scrollbar { display: none; }
@media (max-width: 860px) {
  .ov { place-items: end stretch; }
  .sheet { width: 100%; max-height: none; height: calc(100dvh - 30px); border-radius: 26px 26px 0 0; }
  .grab { display: block; position: absolute; left: 0; right: 0; top: 0; height: 22px; z-index: 4; touch-action: none; cursor: grab; }
  .grab::after { content: ""; position: absolute; left: 50%; top: 8px; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--s3); }
  .shd { padding-top: 20px; touch-action: none; }
  .obody { padding: 4px 18px calc(30px + env(safe-area-inset-bottom, 0px)); }
}
.fly { position: fixed; z-index: 80; pointer-events: none; margin: 0; }

.pv { display: grid; gap: 26px; }
.ph { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 24px; align-items: end; }
.ph .tile { aspect-ratio: 9 / 16; border-radius: 18px; }
.ph .info { display: grid; gap: 12px; align-content: end; }
.ph h2 { font-size: clamp(26px, 3.2vw, 36px); line-height: 1; letter-spacing: -0.04em; }
.sub { font: 500 12px/1.4 var(--mono); color: var(--ink-3); }
.land { display: grid; gap: 10px; }
.land .big { font: 700 58px/.86 var(--display); letter-spacing: -0.055em; }
.land .big.b3, .land .big.b2 { color: var(--rose); }
.land .big small { font-size: .42em; letter-spacing: -0.02em; margin-left: 2px; }
.track { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--b3) 0 10%, var(--b2) 10% 25%, var(--b1) 25% 50%, var(--b0) 50% 100%); }
.track i { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--s1), 0 0 16px rgba(255,255,255,.35); left: var(--to); animation: knob 1.2s var(--sp-pop) backwards .35s; }
@keyframes knob { from { left: 100%; scale: .4; } }
.tl2 { display: flex; justify-content: space-between; font: 600 9.5px/1 var(--mono); color: var(--ink-3); letter-spacing: .08em; }
.sec { display: grid; gap: 12px; }
.sec > .k { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.box { padding: 16px; border-radius: 18px; background: var(--s2); display: grid; gap: 12px; }
.box p, .res p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
.box p b, .res p b { color: var(--ink); font-weight: 600; }
.res svg.ch { width: 100%; height: auto; max-height: 180px; display: block; overflow: visible; }
.res .b { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s var(--sp-pop) backwards; animation-delay: var(--d); }
@keyframes grow { from { transform: scaleY(0); } }
.res .ln2 { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: dash .8s var(--out) forwards; animation-delay: var(--ld); }
@keyframes dash { to { stroke-dashoffset: 0; } }
.res .lb { opacity: 0; animation: fadein .4s var(--out) forwards; animation-delay: var(--ld); }
@keyframes fadein { to { opacity: 1; } }
[data-rv]:not(.in) .res .b, [data-rv]:not(.in) .res .ln2, [data-rv]:not(.in) .res .lb { animation-play-state: paused; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font: 500 10.5px/1 var(--mono); color: var(--ink-3); }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.key i { width: 8px; height: 8px; border-radius: 2px; }
.rtag { display: inline-flex; align-items: center; gap: 5px; font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 5px; white-space: nowrap; }
.rtag.up { color: var(--rose); background: var(--rose-wash); }
.rtag.down { color: var(--down); background: rgba(255,255,255,.08); }
.rtag.flat { color: var(--ink-2); background: var(--s3); }
.beats { list-style: none; margin: 0; padding: 0; display: grid; }
.beats li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--hair); font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.beats li:first-child { border-top: 0; }
.beats li span:first-child { font: 600 11px/1.6 var(--mono); color: var(--ink-3); }
.why { margin: 0; font: 500 19px/1.45 var(--display); letter-spacing: -0.015em; color: var(--ink); }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats4 div { padding: 12px; border-radius: 14px; background: var(--s2); display: grid; gap: 8px; }
.stats4 strong { font: 700 22px/1 var(--display); letter-spacing: -0.03em; }
.stats4 strong.r { color: var(--rose); }
.vlead { margin: 0; font-size: 16px; line-height: 1.6; color: var(--ink-2); }
.verdict { margin: 0; font: 500 19px/1.45 var(--display); letter-spacing: -0.015em; }

}

/* tooltip */

/* ---------- hero: who, the reader's dispatch, three numbers, the pulse ---------- */

@keyframes aurora { 50% { transform: translate(4%, -3%) rotate(8deg) scale(1.05); } 100% { transform: translate(-3%, 4%) rotate(-6deg); } }
.hh { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }

.ring2::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, #fb7185, #f59e0b, #e11d48, #a855f7, #fb7185); animation: spin 6s linear infinite; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }

.ident .k { display: block; }
.hn { display: block; font: 700 20px/1.1 var(--display); letter-spacing: -0.03em; margin-top: 3px; }
.primer { margin: -6px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-3); max-width: 78ch; }
.hbody { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: end; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { position: relative; overflow: hidden; display: grid; gap: 7px; align-content: start; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px var(--hair); text-align: left; transition: background .3s var(--out), scale .45s var(--sp-pop), box-shadow .3s; }

/* the pulse: every reel in memory, oldest to newest, higher = ranked higher */
.pulse { position: relative; margin: 4px -6px 0; }
.psvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; }
.pbands, .ppins { position: absolute; inset: 0; }

.pband:hover span { color: var(--ink); }
.pcur { position: absolute; z-index: 0; border-radius: 16px; pointer-events: none; background: linear-gradient(180deg, rgba(251,113,133,.14), rgba(251,113,133,.02)); box-shadow: inset 0 0 0 1px rgba(251,113,133,.3); transition: left .8s var(--sp-pop), width .8s var(--sp-pop), opacity .4s var(--out); opacity: 0; }
.gd { stroke: rgba(255,255,255,.07); stroke-dasharray: 3 5; }

.pd { transform-box: fill-box; transform-origin: center; cursor: pointer; transition: opacity .35s var(--out); }
.pd .dot { fill: var(--b1); stroke: var(--s1); stroke-width: 2; transition: fill .3s, stroke .3s; }
.pd.b3 .dot { fill: var(--rose); } .pd.b2 .dot { fill: var(--b2); } .pd.b0 .dot { fill: #3a3a43; }

.plt.up { fill: var(--rose); } .plt.dn { fill: #e4e4e7; }
.pin { position: absolute; top: 0; pointer-events: auto; display: flex; gap: 9px; align-items: center; padding: 5px 11px 5px 5px; border-radius: 13px; max-width: 210px; background: rgba(22,22,27,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--hair-2), 0 12px 26px rgba(0,0,0,.45); text-align: left; transition: scale .45s var(--sp-pop), background .25s; }
.pin:hover { background: rgba(34,34,40,.95); scale: 1.03; }
.pin:active { scale: .96; }
.pin .tile { width: 34px; flex: none; border-radius: 7px; }
.pin .pl { min-width: 0; font: 600 12px/1.25 var(--display); letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- lens bar ---------- */
.lens { position: sticky; top: 62px; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px var(--gut); margin: -4px calc(-1 * var(--gut)) -10px; background: rgba(5,5,6,.86); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-bottom: 1px solid transparent; transition: border-color .3s; }
.lens.stuck { border-color: var(--hair); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 2px 36px 2px 2px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.chips::-webkit-scrollbar { display: none; }

.sw { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.sw.m3, .mp i.m3, .pips i.m3 { background: var(--b3); } .sw.m2, .mp i.m2, .pips i.m2 { background: var(--b2); } .sw.m1, .mp i.m1, .pips i.m1 { background: var(--b1); } .sw.m0, .mp i.m0, .pips i.m0 { background: var(--b0); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
.sw.d-idea { background: var(--d-idea); } .sw.d-moment { background: var(--d-moment); } .sw.d-faces { background: var(--d-faces); } .sw.d-craft { background: var(--d-craft); }

@media (max-width: 860px) { .sortd { display: none !important; } .sortm { display: inline-flex !important; } }

.wallhd { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin-top: 8px; }
.wallhd .k { display: block; }
.hint { display: block; margin-top: 6px; font: 500 11.5px/1.4 var(--mono); color: var(--ink-3); }

/* ---------- the wall: the feed itself, newest first, runs as dividers ---------- */
.wall { position: relative; }
.feed { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 16px 8px; }
.rdiv, .bdiv { grid-column: 1 / -1; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 4px 2px; border-top: 1px solid var(--hair); text-align: left; transition: opacity .4s var(--out); }
.rdiv:first-child, .bdiv:first-of-type { border-top: 0; padding-top: 2px; }
.feed.ranked .rdiv, .feed:not(.ranked) .bdiv { display: none; }
.rdiv b, .bdiv b { font: 600 16px/1.2 var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rdiv .k { color: var(--ink-2); transition: color .3s; }

.rdiv .sub, .bdiv .sub { font: 500 11.5px/1.2 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.rdiv .pips i { flex: 1; border-radius: 2px; }
.rdiv.on .k { color: var(--rose); }
.rdiv.on b { color: #fff; }
.bdiv { grid-template-columns: auto auto minmax(0, 1fr); }
.wall.runpick .tile:not(.inrun):not(.hit):not(.sel):not(.beat):not(.above):not(.stop) { opacity: .25; }
.wall.runpick .rdiv:not(.on) { opacity: .4; }
.feed .tile:not(.seen) { opacity: 0; }
.wall .tile .cap { top: 21%; -webkit-line-clamp: 3; }
.wall .face .rs { display: none; }
.tg { position: absolute; z-index: 3; pointer-events: none; opacity: 0; translate: 0 6px; scale: .9; transition: opacity .3s var(--out), translate .55s var(--sp-pop), scale .55s var(--sp-pop); transition-delay: calc(var(--k, 0) * 7ms); font: 700 clamp(7px, 8.8cqi, 11px)/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 5px; border-radius: 5px; white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis; }
.tb, .tw, .ts { left: 6%; bottom: 6%; }
.tr { left: 6%; top: 6%; }
.L-rank .tb, .L-rank .tr, .L-why .tw, .L-bits .ts { opacity: 1; translate: 0 0; scale: 1; }
.tb { background: rgba(8,8,10,.66); color: #e4e4e7; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); backdrop-filter: blur(6px); }
.tb.b3 { background: var(--rose); color: #1a0307; box-shadow: none; }
.tb.b2 { color: var(--rose); box-shadow: inset 0 0 0 1px rgba(251,113,133,.7); }
.tr.up { background: rgba(251,113,133,.92); color: #1a0307; }
.tr.dn { background: rgba(8,8,10,.62); color: #e4e4e7; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); backdrop-filter: blur(6px); }
.tw { color: #0b0b0d; }
.tw.d-idea { background: var(--d-idea); } .tw.d-moment { background: var(--d-moment); } .tw.d-faces { background: var(--d-faces); } .tw.d-craft { background: var(--d-craft); }
.ts { background: rgba(8,8,10,.66); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); backdrop-filter: blur(6px); }
/* focus */
.wall.focus .tile:not(.sel):not(.beat):not(.above):not(.stop):not(.hit) { opacity: .13; }
.wall.focus .tile:not(.sel):not(.beat):not(.above):not(.stop):not(.hit) .ring { animation: none; box-shadow: none; }
.wall .tile.hit .face, .wall .tile.beat .face, .wall .tile.above .face, .wall .tile.stop .face { filter: none; }
.wall .tile.hit .face.gray, .wall .tile.beat .face.gray { filter: grayscale(1) contrast(1.08); }
.tile.hit.go { animation: hitpop .7s var(--sp-pop) backwards; animation-delay: var(--wd); }

.tile .mk { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; overflow: hidden; }
.tile.beat .mk { opacity: 1; background: linear-gradient(0deg, rgba(251,113,133,.5), rgba(251,113,133,.08) 70%); box-shadow: inset 0 0 0 2px rgba(251,113,133,.9); }

.wall .tile.stop .ring { animation: none; box-shadow: 0 0 0 2.5px #e4e4e7; }
.wall .tile.stop .ring[data-flag]::after { content: attr(data-flag); position: absolute; left: 50%; top: -10px; translate: -50% 0; font: 700 9px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: #e4e4e7; color: #000; padding: 4px 6px; border-radius: 5px; white-space: nowrap; z-index: 6; }

.tlines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; overflow: visible; }
.tlines line { stroke-width: 3; stroke-linecap: round; }

.tlines .dn { stroke: #e4e4e7; stroke-dasharray: 2 5; }
.thead { position: absolute; left: 0; top: 0; z-index: 9; pointer-events: none; transform: translate(var(--x, 0), var(--y, 0)) translate(-50%, -50%) scale(.6); opacity: 0; transition: transform var(--dt, 120ms) cubic-bezier(.3,.7,.25,1), opacity .3s var(--out), background .3s; font: 700 11px/1 var(--mono); letter-spacing: .02em; padding: 6px 10px; border-radius: 999px; background: var(--rose); color: #1a0307; box-shadow: 0 0 0 3px rgba(5,5,6,.92), 0 8px 22px rgba(251,113,133,.55); white-space: nowrap; }

/* ---------- reader card ---------- */

.cin { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 14px; border-radius: 24px; background: rgba(20, 20, 25, 0.96); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 24px 70px rgba(0,0,0,.65), inset 0 0 0 1px var(--hair-2); max-height: min(46vh, 380px); }

.cf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; }

.open { position: relative; overflow: hidden; padding: 11px 16px; border-radius: 13px; background: var(--ink); color: var(--bg); font: 600 13px/1 var(--display); white-space: nowrap; transition: scale .4s var(--sp-pop); }

.bw.d-idea { background: var(--d-idea); } .bw.d-moment { background: var(--d-moment); } .bw.d-faces { background: var(--d-faces); } .bw.d-craft { background: var(--d-craft); }

@media (max-width: 1100px) { .feed { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  main { gap: 16px; }

: Ronaldo “robbed” by FIFA, Mbappé watching PSG win without him, trash talk on the turf that ends with him in the net. 2 of 3 made his top quarter. It works when he’s the wounded fan; the sponsored jersey lookbook is football too, and it came #38 of 40."}, {"id": "crew", "name": "The crew being idiots", "what": "Sketches with his friends where something dumb happens: a sock used as a tissue in the office, SoBo kids panicking outside Bombay, a Clubhouse-style room that falls apart.", "verdict": "Two hits and one flop. The sock prank (top 10%) and the SoBo panic (top 28%) each have one clear joke. The Clubhouse mashup piles up references and landed near the bottom.", "sub": "Dumb moments with his friends", "take": "His friends doing dumb things: the sock-for-a-tissue office prank, South Bombay kids panicking outside their bubble, a Clubhouse room falling apart. The sock prank beat the 20 reels before it. The Clubhouse one crammed six celebrities and a rap verse into one joke and sank."}, {"id": "bmw", "name": "The BMW (pre-roasted)", "what": "His matte black BMW M340i, always posted with a caption that mocks the flex first: “we get it bro”, then “yall just have to get used to these”.", "verdict": "Both landed in the upper third. The second one beat 10 posts in a row.", "sub": "His BMW, always mocked in the caption", "take": "He bought a matte-black BMW M340i and keeps posting it, always with a caption that rolls its eyes first: “we get it bro”, then “y’all just have to get used to these”. That eye-roll is the trick. Both landed in his top third."}, {"id": "food", "name": "Eating out with friends", "what": "Him and friends at a Mumbai restaurant naming dishes: O Pedro (coconut prawns, burrata), Baskin Robbins (Dubai chocolate sundae).", "verdict": "Both landed well (top 20% and top 32%). There’s no joke in them; this is a separate lifestyle lane from the comedy.", "sub": "Eating out in Mumbai with friends", "take": "Eating out in Mumbai with friends: O Pedro, Baskin Robbins. Not a single joke, and both still landed in his top third. His crowd likes hanging out with him, not just laughing at him."}, {"id": "place", "name": "5-second place puns", "what": "New in run 4. A 5–7 second two-hander where a vague line ends on a place name: “I’m in a bad place” → “Andheri East”, “I’m in a bad state” → “UP”.", "verdict": "Tried twice in one week with opposite results: Andheri East top 15%, UP top 88%. Andheri East is a commute every Mumbaikar has suffered. UP is only a word pun.", "sub": "5-second jokes that end on a place name", "take": "New in run 4: five-second jokes that end on a place name. “Bad place” → Andheri East made his top 15%. “Bad state” → UP sank to #35. Andheri East is a commute every Mumbaikar has suffered; UP is just wordplay. One more try will tell us whether this is a format or a fluke."}, {"id": "street", "name": "Loose on the street", "what": "He walks up to real people: mediates a roadside crash with a forced hug, lies to a parking attendant about a driver who doesn’t exist, hosts street rap battles and roasts.", "verdict": "The steadiest thing he posts: all 4 landed between top 35% and top 50%. Never a hit, never a flop.", "sub": "Unscripted bits with real strangers", "take": "Anuj with real strangers: forcing a hug at a road fight, lying to a parking attendant about a driver who doesn’t exist, hosting rap battles and roasts. All four in his top half, none in the top quarter. The strangers are gold; the reels run a minute too long."}, {"id": "city", "name": "Delhi vs Mumbai", "what": "Mumbai shrugs while Delhi panics at an alarm, a Delhi voice roasting him, a rant about ₹248 crore spent on 750 m of unfinished flyover.", "verdict": "Middle to low (top 42% to 75%). Comparing cities lands worse than jokes from inside Mumbai.", "sub": "Delhi vs Mumbai and city complaints", "take": "City jabs: Mumbai shrugs while Delhi panics at an alarm, a Delhi voice roasting him, a rant about a ₹248 crore flyover. The alarm one held his top half; the other two sank below it. City stereotypes are middle-of-the-pack at best for him."}, {"id": "brand", "name": "Brand deals", "what": "Paid posts: Blinkit (an AI replaces him as the son, for Mother’s Day), Broadway’s Bandra launch, District (an MJ mix-up), Lotto x H&M jerseys, a Startup Village rapid-fire panel.", "verdict": "The widest spread in the account: #1 and #40 are both brand deals. When the brand is written into one of his sketches (Blinkit, Broadway) it lands. When it brings its own format (a jersey lookbook, a panel Q&A) it lands last.", "sub": "Paid partnerships", "take": "Five sponsored reels and the widest spread in the feed: #1 and #40. Blinkit wrote him into a Mother’s Day story where an AI replaces him as the son: #1 of 40. Broadway gave him a scene (“Not Anuj’s PA”). Lotto x H&M (a lookbook) and Startup Village (a panel Q&A) gave him a format with no joke, and his crowd scrolled. Hire the bit, not the face."}, {"id": "both", "name": "Playing both sides", "what": "He plays both sides of a conversation with jump cuts: flatmates deciding to move in, girls’ vs boys’ life updates, the rich friend’s “humble beginnings”.", "verdict": "Middle to low (top 52% to 80%). The two-character format on its own doesn’t carry a post; it needs a sharp target.", "sub": "He plays both people in a conversation", "take": "He plays both people in a conversation with jump cuts: flatmates moving in, girls’ vs boys’ life updates, the rich friend’s “humble beginnings”. All three in his bottom half. The format doesn’t carry anything on its own."}, {"id": "solo", "name": "Just Anuj, about Anuj", "what": "Just him and his own life: waking at 2 PM to the emergency alert, a backseat story, handing cash to a worker, reviewing water glasses, a tattoo, a piano take.", "verdict": "His weakest recurring thing by volume: 6 posts, none above top 55%.", "sub": "Just him, about his own day", "take": "Just him and his own day: sleeping through the emergency alert, reviewing drinking glasses, a tattoo, a piano take, cash for a scaffolding worker. Six reels, none made his top half. Without someone to roast, there’s nothing to send to the group chat."}, {"id": "family", "name": "Getting told off at home", "what": "Monologues where someone at home judges his Instagram life: a friend says scrolling reels isn’t a job, his mom mocks his self-praise, he plays his dad calling his videos “waahiyat”.", "verdict": "All 3 landed in the bottom quarter. When he’s the one being judged, it doesn’t land.", "sub": "Family judging his Instagram career", "take": "Somebody at home tells Anuj off: his dad (played by him, in black and white) calls his videos “waahiyat”, his mom teases his self-praise, a friend says reels aren’t a job. His crowd follows him to watch him roast everyone else. Flip it and they keep scrolling: all three in his bottom quarter."}], "runRecaps": {"1": {"head": "A Blinkit ad became his best post", "body": "Blinkit’s Mother’s Day ad, where his mom swaps him for an AI assistant, ranked #1 of all 40 posts. A sketch about creators who think one viral video makes them an “IP” ranked #3. His new BMW debuted with the caption “we get it bro” and landed in his top 25%. Solo bits about his own day (sleeping through the emergency alert, a friend’s lecture that reels aren’t a job) landed in his bottom half."}, "2": {"head": "A Parle parody hit #2; a sponsored panel hit #40", "body": "His parody of Parle’s marketing team milking the “Melodi” meme beat each of the 9 posts before it and ranked #2. Street bits with strangers (a made-up driver, a rap battle at a cosmetics stall, a bathrobe roast) all landed mid-table. A sponsored Startup Village rapid-fire panel ranked #40, below every post before it."}, "3": {"head": "Seven of ten sank; the BMW sequel saved it", "body": "Mostly him alone: reviewing drinking glasses, his mom mocking his self-praise, a tattoo, a piano take. Seven of ten landed in his bottom half. The second BMW post (“get used to these”) beat each of the 10 posts before it. A sponsored Lotto x H&M jersey lookbook ranked #38."}, "4": {"head": "His friend-group sketches carried the run", "body": "Six of ten landed in his top 25%. Best: an office prank where a friend’s sock gets used as a tissue, which beat each of the 20 posts before it. A rant that Ronaldo’s losses are “rigged for Messi” beat 16. He tried a new 5-second joke twice: “I’m in a bad place” → “Andheri East” landed in his top 15%; “I’m in a bad state” → “UP” landed in his bottom 15%."}}, "read": [{"label": "Works best", "text": "Parodies of his own industry: Parle’s marketers, creators after one viral video, a “pitch” that’s a Ludo game. 3 of 4 landed in his top 20%.", "series": "biz"}, {"label": "Works least", "text": "Family judging his Instagram career: his dad calls his videos “waahiyat”, his mom mocks his self-praise, a friend says reels aren’t a job. All 3 landed in his bottom quarter.", "series": "family"}, {"label": "Watch next", "text": "The new 5-second place-name joke. Andheri East (a commute every Mumbaikar knows) landed top 15%; UP (just a pun) landed bottom 15%.", "series": "place"}], "dateNote": "Dates are approximate (from each card’s age), anchored so the Mother’s Day post lands on May 8.", "who": "his", "dispatch": {"all": {"head": "The read so far", "body": "His crowd comes to watch Anuj roast everyone else: his own industry, his own BMW, his own city. They show up hardest when his friends are in it. They keep scrolling when he’s alone, preachy, or the one getting told off."}, "1": {"head": "Blinkit carried the run", "body": "The Mother’s Day Blinkit ad, where his mom swaps him for an AI helper because he’s “too busy being an influencer”, became the best-fed reel of the 90 days. The creators-who-went-viral-once sketch with Ruhee Dosani made his top 10% too. The BMW debuted pre-roasted (“we get it bro”) and made the top quarter. Everything where it’s just him at home (sleeping through the alert, getting lectured about r   decorate(true); pulseFocus(); renderCard();
  document.querySelectorAll('[data-pick]').forEach((x) => x.setAttribute('aria-pressed', String(String(S.pick) === x.dataset.pick)));
}
function setSort(v) {
  if (v === S.sort) return;
  S.sort = v; buzz(); clearTrail();
  segRender($('sortsw'), sortBtns(), true); segRender($('sortsw2'), sortBtns(), true);
  applySort(true); $('hint').innerHTML = hintHTML(); $('feedk').textContent = `The feed · ${F().who} last ${full().n} reels · ${v === 'posted' ? 'newest first' : 'by rank'}`;
  if (S.sel && S.layer === 'rank') setTimeout(() => playTrail(full().byId[S.sel]), SP.soft.dur);
}
const sortBtns = () => [['posted', 'As posted'], ['ranked', 'By rank']].map(([id, l]) => `<button type="button" data-sort="${id}" aria-current="${S.sort === id}">${l}</button>`).join('');
function selRun(r) {
  if (r === S.run) return;
  const prev = S.run; S.run = r; buzz(); runSeg(true);
  const dir = r === 'all' ? -1 : prev === 'all' ? 1 : r < prev ? 1 : -1;
  const dtx = $('dtx'), kp = $('kpis');
  const swap = () => {
    dtx.innerHTML = dispHTML(); kp.innerHTML = kpiHTML(); countUps(kp);
    [...dtx.children].forEach((el, k) => A(el, [{ opacity: 0, transform: `translateX(${dir * 24}px)`, filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { delay: k * 55, fill: 'backwards' }));
    [...kp.children].forEach((el, k) => A(el, [{ opacity: 0, transform: 'translateY(12px) scale(.96)' }, { opacity: 1, transform: 'none' }], { ...SP.pop, delay: 80 + k * 70, fill: 'backwards' }));
    drawPins(true);
  };
  if (reduce) swap();
  else {
    [dtx, kp, $('ppins')].forEach((el) => el.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(6px)' }], { duration: 170, easing: 'ease-in' }));
    setTimeout(swap, 160);
  }
  placeCur(true); pulseFocus(); decorate(false);
}

/* ---------- detail sheet ---------- */
function postView(p) {
  const M = full(), f = M.f, s = M.sById[p.series], sib = s.items, nth = sib.indexOf(p) + 1, his = f.who;
  const beats = (p.flow || []).slice(0, 6);
  return `<div class="pv">
    <div class="ph">${tile(p, { still: true, cls: 'hero lit' })}
      <div class="info"><button type="button" class="chip vpc" data-series="${s.id}" style="justify-self:start">${esc(s.name)} <em>${s.id === 'oneoff' ? 'one-off' : `${nth} of ${sib.length}`}</em></button>
        <h2>${esc(p.label)}</h2><span class="sub">${fd(p.date)} · ${M.runs > 1 ? `Run ${p.run} · ` : ''}${p.length ? esc(p.length) + ' · ' : ''}reel</span>
        <div class="land"><div class="big b${p.band}">#<span data-count="${p.rank}">${p.rank}</span><small> of ${M.n}</small></div><div class="track"><i style="--to:${Math.min(100, p.pct)}%"></i></div><div class="tl2"><span>${his.toUpperCase()} BEST</span><span>${word(p).toUpperCase()}${p.pct_fixed != null ? ` · ${p.views}× USUAL VIEWS` : ''}</span><span>WORST</span></div></div></div></div>
    <section class="sec" data-rv style="--rd:60"><span class="k">The reader’s take</span><p class="why">${esc(p.take)}</p></section>
    <section class="sec" data-rv style="--rd:120"><span class="k"><span>Against the reels before it</span><span class="bw ${p.ripple ? 'b2' : 'b0'}">${beatShort(p)}</span></span>${resChart(p)}</section>
    <section class="sec" data-rv><span class="k">What decided it</span><div class="box dbox"><span class="bw d-${p.driver}" style="justify-self:start">${DRV[p.driver][0]}: ${DRVQ[p.driver]}</span><p>${esc(f.drivers[p.driver] || '')}</p></div></section>
    ${beats.length ? `<section class="sec" data-rv><span class="k">What happens in it</span><ol class="beats">${beats.map((b) => `<li><span>${esc(b.t || '•')}</span><span>${esc(b.beat)}</span></li>`).join('')}</ol></section>` : `<section class="sec" data-rv><span class="k">Caption</span><p class="why" style="color:var(--ink-2)">“${esc(p.hook)}”</p></section>`}
    ${sib.length > 1 ? `<section class="sec" data-rv><span class="k"><span>${s.id === 'oneoff' ? 'Other one-offs' : `Every go at “${esc(s.name)}”`}</span><span>higher = ranked higher</span></span>${podium(sib, { cur: p.id, style: `--ph:${phone() ? 160 : 180}px;--tw:86px` })}</section>` : ''}
  </div>`;
}
function seriesView(s) {
  const M = full(), hard = s.items.filter((p) => p.band >= 2).length;
  return `<div class="pv">
    <div class="shero" data-rv>${stack(s.items, { cap: true })}<div style="display:grid;gap:12px"><span class="k">${s.id === 'oneoff' ? 'One-offs' : `A bit ${F().who === 'his' ? 'he keeps' : 'they keep'} doing`}</span><h2 style="font-size:clamp(30px,3.6vw,44px);line-height:.98;letter-spacing:-.045em">${esc(s.name)}</h2><span class="bw b${band(s.med)}" style="justify-self:start">Typical: top ${pc(s.med)}%</span></div></div>
    <div class="stats4" data-rv style="--rd:60"><div><span class="k">Goes</span><strong class="num">×<span data-count="${s.items.length}">${s.items.length}</span></strong></div><div><span class="k">First</span><strong>${fd(s.first)}</strong></div><div><span class="k">Latest</span><strong>${fd(s.last)}</strong></div><div><span class="k">In top 25%</span><strong class="${hard ? 'r' : ''}"><span data-count="${hard}">${hard}</span> of ${s.items.length}</strong></div></div>
    <section class="sec" data-rv style="--rd:120"><span class="k">The read</span><p class="verdict">${esc(s.take)}</p></section>
    <section class="sec" data-rv style="--rd:160"><span class="k"><span>Every go, in order</span><span>higher = ranked higher · tap one</span></span>${podium(s.items, { style: `--ph:${phone() ? 180 : 210}px;--tw:96px` })}</section>
  </div>`;
}

/* ---------- tooltip ---------- */
function showTip(el) {
  if (!fine || ovOpen) return;
  const p = full().byId[el.dataset.post]; if (!p) return;
  const t = $('tip');
  t.innerHTML = `${tile(p, { still: true, nocap: true, cls: 'lit' })}<div><b>${esc(p.label)}</b><span>${fd(p.date)} · #${p.rank} · ${beatShort(p)}</span></div>`;
  const r = el.getBoundingClientRect();
  t.style.left = Math.min(innerWidth - 300, Math.max(10, r.left + r.width / 2 - 145)) + 'px';
  t.style.top = (r.top - 84 < 120 ? r.bottom + 10 : r.top - 84) + 'px';
  t.classList.add('on');
}
function hideTip() { $('tip').classList.remove('on'); }
document.addEventListener('pointerover', (e) => { const el = e.target.closest('#feed .tile[data-post], #psvg .pd'); if (el) showTip(el); });
document.addEventListener('pointerout', (e) => { if (e.target.closest('#feed .tile, #psvg .pd')) hideTip(); });

/* ---------- page ---------- */
function render(dir) {
  const M = full(), f = M.f;
  renderChrome(dir !== undefined);
  const main = $('main');
  const put = () => {
    main.innerHTML = `<section class="hero" id="hero">
        <div class="hh"><div class="ident"><span class="ring2"><span class="av ${S.f ? 'l' : ''}"></span></span><div><span class="k"><b>The Feeder Reader</b> · ${esc(f.kind)}</span><span class="hn">@${esc(f.handle)}</span></div></div><div class="seg runsw" id="runsw" role="group" aria-label="Run"></div></div>
        <p class="primer">${esc(f.primer)}</p>
        <div class="hbody"><div class="dtx" id="dtx">${dispHTML()}</div><div class="kpis" id="kpis">${kpiHTML()}</div></div>
        <div class="pulse" id="pulse" aria-label="Every reel in memory by where it landed, oldest to newest"><div class="pbands" id="pbands"></div><svg class="psvg" id="psvg" preserveAspectRatio="none"></svg><div class="ppins" id="ppins"></div></div>
      </section>
      <div class="lens" id="lens"><div class="seg tabs-top" id="layerTop" role="group" aria-label="Layer"></div><div class="chips" id="chips"></div><div class="seg sortd" id="sortsw" role="group" aria-label="Order"></div></div>
      <div class="wallhd"><div><span class="k" id="feedk">The feed · ${S.f ? 'their' : 'his'} last ${M.n} reels · ${S.sort === 'posted' ? 'newest first' : 'by rank'}</span><span class="hint" id="hint"></span></div><div class="seg sortm" id="sortsw2" role="group" aria-label="Order"></div></div>
      <section class="wall L-${S.layer}" id="wall" aria-label="The feed"><div class="feed" id="feed">${feedHTML()}</div><svg class="tlines" id="tlines" aria-hidden="true"></svg><span class="thead" id="thead" aria-hidden="true"></span></section>
      <p class="foot">${esc(note())}</p>`;
    runSeg(false); renderChrome(false); segRender($('sortsw'), sortBtns(), false); segRender($('sortsw2'), sortBtns(), false); refreshChips(false);
    applySort(false); armFeed(); decorate(false); renderCard(); countUps($('kpis'));
    drawPulse(!reduce);
    if (dir !== undefined && !reduce) A(main, [{ opacity: 0, transform: `translateX(${dir * 30}px)`, filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { fill: 'backwards' });
    if (!reduce) [...$('hero').children].forEach((el, k) => A(el, [{ opacity: 0, transform: 'translateY(18px)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { delay: k * 80, fill: 'backwards' }));
  };
  if (dir !== undefined && !reduce) main.animate([{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: `translateX(${-dir * 30}px)`, filter: 'blur(6px)' }], { duration: 170, easing: 'ease-in', fill: 'forwards' }).onfinish = () => { window.scrollTo({ top: 0 }); put(); main.getAnimations().forEach((a) => a.playState === 'finished' && a.cancel()); };
  else put();
}

document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s); let b;
  if ((b = q('[data-f]'))) { const k = +b.dataset.f; if (k !== S.f) { closeOv(); clearTrail(); S.f = k; S.run = 'all'; S.sel = null; S.pick = null; S.sort = 'posted'; buzz(); render(k > 0 ? 1 : -1); } return; }
  if ((b = q('[data-layer]'))) { setLayer(b.dataset.layer); return; }
  if ((b = q('#closeOv')) || (b = q('#scrim'))) { closeOv(); return; }
  if ((b = q('[data-back]'))) { S.stack.pop(); swapOv(-1); return; }
  if ((b = q('[data-step]'))) { const cur = full().byId[S.stack[S.stack.length - 1].id], nx = full().byId[b.dataset.step]; stepTo(nx.id, nx.i > cur.i ? 1 : -1); return; }
  if ((b = q('[data-run-div]'))) { const r = +b.dataset.runDiv; selRun(S.run === r ? 'all' : r); return; }
  if ((b = q('[data-band-run]'))) { const r = +b.dataset.bandRun; selRun(S.run === r ? 'all' : r); return; }
  if ((b = q('[data-run]'))) { const v = b.dataset.run; selRun(v === 'all' ? 'all' : +v); return; }
  if ((b = q('[data-sort]'))) { setSort(b.dataset.sort); return; }
  if ((b = q('[data-pick]'))) { const v = b.dataset.pick; pick(S.layer === 'rank' ? +v : v); return; }
  if ((b = q('[data-cclear]'))) { buzz(); clearFocus(); return; }
  if ((b = q('[data-open]'))) { const id = b.dataset.open; openEntry({ type: 'post', id }, document.querySelector(`#feed .tile[data-post="${id}"]`)); return; }
  if ((b = q('[data-oseries]'))) { openEntry({ type: 'series', id: b.dataset.oseries }, null); return; }
  if ((b = q('[data-sel]'))) { const id = b.dataset.sel; if (S.sel === id) openEntry({ type: 'post', id }, b.querySelector('.tile') || b); else selectPost(id); return; }
  if ((b = q('#psvg .pd'))) { const id = b.dataset.post; if (S.sel === id) openEntry({ type: 'post', id }, null); else selectPost(id); return; }
  if ((b = q('#feed .tile[data-post]'))) { const id = b.dataset.post; if (S.sel === id) openEntry({ type: 'post', id }, b); else selectPost(id, { scroll: true }); return; }
  if ((b = q('[data-post]'))) { openEntry({ type: 'post', id: b.dataset.post }, b); return; }
  if ((b = q('[data-series]'))) { openEntry({ type: 'series', id: b.dataset.series }, b); return; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (ovOpen) { if (S.stack.length > 1) { S.stack.pop(); swapOv(-1); } else closeOv(); } else if (S.sel || S.pick != null) clearFocus(); return; }
  if (ovOpen && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const top = S.stack[S.stack.length - 1]; if (top.type !== 'post') return; const p = full().byId[top.id], n = full().posts[p.i + (e.key === 'ArrowRight' ? 1 : -1)]; if (n) stepTo(n.id, e.key === 'ArrowRight' ? 1 : -1); }
});
addEventListener('scroll', () => { const l = $('lens'); if (l) l.classList.toggle('stuck', l.getBoundingClientRect().top <= (phone() ? 57 : 63)); }, { passive: true });
let rz, lastW = innerWidth; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { document.querySelectorAll('.seg').forEach((s) => placeInd(s, false)); fixPods(); if (innerWidth !== lastW) { lastW = innerWidth; drawPulse(false); if (S.sel && S.layer === 'rank') playTrail(full().byId[S.sel]); } }, 140); });
if (document.fonts) document.fonts.ready.then(() => { document.querySelectorAll('.seg').forEach((s) => placeInd(s, false)); fixPods(); drawPins(false); });
render();
</script>
</body>
</html>
